<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧線上聯絡簿</title>
    <!-- 引入 Tailwind CSS 用於快速美化介面 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入中文手寫楷體字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* 定義專屬的手寫風格字體 */
        .handwriting-font {
            font-family: "全字庫正楷體", "TW-Kai", "BiauKai", "DFKai-SB", "標楷體", "KaiTi", serif;
        }

        /* ================= 黑板主題 ================= */
        :root {
            --board: #22402f;
            --board-dark: #1a3224;
            --chalk: #f3f1e7;
            --chalk-dim: rgba(243, 241, 231, 0.65);
            --chalk-line: rgba(243, 241, 231, 0.45);
            --chalk-yellow: #f7e07a;
            --chalk-green: #b8f0ae;
            --chalk-blue: #a6d8f5;
            --chalk-pink: #f6adbb;
            --wood: #7b5432;
            --wood-dark: #3f2a18;
        }

        /* 黑板背景 + 粉筆灰暈染（整頁撐滿螢幕高度） */
        body.blackboard {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: var(--board);
            background-image:
                radial-gradient(ellipse at 20% 12%, rgba(255, 255, 255, 0.08), transparent 45%),
                radial-gradient(ellipse at 82% 68%, rgba(255, 255, 255, 0.05), transparent 50%),
                radial-gradient(ellipse at 50% 105%, rgba(0, 0, 0, 0.35), transparent 60%);
            background-attachment: fixed;
            color: var(--chalk);
            text-shadow: 0 0 1px rgba(255, 255, 255, 0.25);
        }

        /* 黑板木框 */
        body.blackboard::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 40;
            border: clamp(6px, 1.2vw, 14px) solid var(--wood);
            box-shadow: inset 0 0 0 3px var(--wood-dark), inset 0 0 50px rgba(0, 0, 0, 0.55);
        }

        /* 主內容區撐滿剩餘畫面 */
        main.fullscreen-main {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            width: 100%;
            min-height: 0;
        }
        #view-frontend { flex: 1 1 auto; min-height: 0; }

        /* 頂部木製導覽列 */
        .nav-wood {
            background: repeating-linear-gradient(90deg, #7b5432 0 14px, #734e2e 14px 28px);
            border-bottom: 6px solid var(--wood-dark);
            color: #f6efd8;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }
        .tab-btn {
            border: 2px solid rgba(246, 239, 216, 0.55);
            color: #f6efd8;
            background: transparent;
        }
        .tab-btn:hover { background: rgba(246, 239, 216, 0.18); }
        .tab-btn-active {
            background: #f6efd8;
            color: var(--wood-dark);
            border: 2px solid #f6efd8;
            text-shadow: none;
        }

        /* 粉筆框面板 */
        .chalk-panel {
            background: rgba(255, 255, 255, 0.04);
            border: 2px dashed var(--chalk-line);
            border-radius: 1rem;
            color: var(--chalk);
        }

        /* 文字顏色 */
        .chalk-title { color: var(--chalk-yellow); }
        .chalk-green { color: var(--chalk-green); }
        .chalk-blue { color: var(--chalk-blue); }
        .chalk-text { color: var(--chalk); }
        .chalk-dim { color: var(--chalk-dim); }

        /* 空狀態 / 載入 / 錯誤提示（直式置中） */
        .chalk-empty {
            writing-mode: vertical-rl;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            height: 100%;
            letter-spacing: 0.15em;
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed var(--chalk-line);
            border-radius: 1rem;
            color: var(--chalk-dim);
        }
        .chalk-error { color: var(--chalk-pink); }

        /* 輸入框 */
        .chalk-input {
            background: rgba(0, 0, 0, 0.28);
            border: 2px solid var(--chalk-line);
            color: var(--chalk);
            color-scheme: dark;
        }
        .chalk-input::placeholder { color: rgba(243, 241, 231, 0.4); }
        .chalk-input:focus {
            outline: none;
            border-color: var(--chalk-yellow);
            box-shadow: 0 0 0 3px rgba(247, 224, 122, 0.25);
        }
        .chalk-input:disabled { opacity: 0.55; cursor: not-allowed; }

        /* 粉筆按鈕 */
        .chalk-btn {
            background: transparent;
            border: 2px solid currentColor;
            transition: background 0.2s, color 0.2s;
        }
        .chalk-btn-yellow { color: var(--chalk-yellow); }
        .chalk-btn-yellow:hover { background: rgba(247, 224, 122, 0.18); }
        .chalk-btn-green { color: var(--chalk-green); }
        .chalk-btn-green:hover { background: rgba(184, 240, 174, 0.18); }
        .chalk-btn-blue { color: var(--chalk-blue); }
        .chalk-btn-blue:hover { background: rgba(166, 216, 245, 0.18); }
        .chalk-btn-pink { color: var(--chalk-pink); }
        .chalk-btn-pink:hover { background: rgba(246, 173, 187, 0.18); }
        .chalk-btn-gray { color: var(--chalk-dim); }
        .chalk-btn-gray:hover { background: rgba(243, 241, 231, 0.12); color: var(--chalk); }

        /* 狀態徽章 */
        .badge { border: 1px solid; }
        .badge-green { background: rgba(184, 240, 174, 0.15); color: var(--chalk-green); border-color: rgba(184, 240, 174, 0.6); }
        .badge-yellow { background: rgba(247, 224, 122, 0.15); color: var(--chalk-yellow); border-color: rgba(247, 224, 122, 0.6); }
        .badge-pink { background: rgba(246, 173, 187, 0.15); color: var(--chalk-pink); border-color: rgba(246, 173, 187, 0.6); }

        /* 表格 */
        .chalk-th { border-bottom: 2px dashed var(--chalk-line); color: var(--chalk-dim); }
        .chalk-row { border-bottom: 1px dashed rgba(243, 241, 231, 0.25); transition: background 0.2s; }
        .chalk-row:hover { background: rgba(255, 255, 255, 0.06); }
        .chalk-row-dim { background: rgba(255, 255, 255, 0.03); }

        /* 表格操作文字按鈕 */
        .act-yellow { color: var(--chalk-yellow); }
        .act-yellow:hover { background: rgba(247, 224, 122, 0.15); }
        .act-green { color: var(--chalk-green); }
        .act-green:hover { background: rgba(184, 240, 174, 0.15); }
        .act-blue { color: var(--chalk-blue); }
        .act-blue:hover { background: rgba(166, 216, 245, 0.15); }
        .act-pink { color: var(--chalk-pink); }
        .act-pink:hover { background: rgba(246, 173, 187, 0.15); }

        /* 登入燈箱 */
        .modal-card {
            background: var(--board-dark);
            border: 4px solid var(--wood);
            box-shadow: 0 0 0 2px var(--wood-dark), 0 20px 50px rgba(0, 0, 0, 0.6);
            color: var(--chalk);
        }
        .modal-head {
            background: repeating-linear-gradient(90deg, #7b5432 0 14px, #734e2e 14px 28px);
            color: #f6efd8;
            border-bottom: 4px solid var(--wood-dark);
        }
        .chalk-error-box {
            background: rgba(246, 173, 187, 0.12);
            color: var(--chalk-pink);
            border: 2px dashed rgba(246, 173, 187, 0.6);
        }

        /* ================= 直式排版（由右到左，由上到下） ================= */
        #frontend-content {
            display: flex;
            flex-direction: column;
            min-height: 70vh;
        }

        /* 聯絡簿卡片：整張直式書寫，欄位由右往左排列，超出時可左右捲動 */
        .v-card {
            writing-mode: vertical-rl;
            flex: 1 1 auto;
            min-height: 70vh;
            overflow-x: auto;
            overflow-y: hidden;
            display: block;
        }

        /* 最右側：日期 + 標籤 */
        .v-head {
            display: flex;
            flex-direction: row;          /* 直式下 row = 由上往下 */
            align-items: center;
            justify-content: flex-start;
            gap: 1.25rem;
            padding: 1.5rem 1.25rem;
            background: rgba(247, 224, 122, 0.08);
            border-left: 2px dashed var(--chalk-line);
            letter-spacing: 0.1em;
        }

        /* 直式文字中：英文字母直立（P、CH 等每個字母都站直），數字橫排 */
        .v-latin {
            text-orientation: upright;
        }
        .v-num,
        .v-code {
            -webkit-text-combine: horizontal;
            text-combine-upright: all;
        }

        /* 各區塊（今日作業 / 老師的話） */
        .v-section {
            padding: 1.5rem 1.25rem;
        }
        .v-section h4 {
            margin-left: 1.25rem;          /* 標題與內文的間距（內文在標題左側） */
            letter-spacing: 0.15em;
        }
        .v-text {
            overflow-wrap: anywhere;
        }
        .v-hw {
            padding-right: 1.5rem;
            border-right: 4px dashed var(--chalk-green);
        }
        .v-note {
            padding: 1.5rem;
            border-radius: 1rem;
            background: rgba(255, 255, 255, 0.07);
            border: 2px dashed rgba(166, 216, 245, 0.45);
        }

        /* 區塊之間的直線分隔 */
        .v-divider {
            border-right: 2px dashed var(--chalk-line);
            margin: 0 0.25rem;
        }
    </style>
</head>
<body class="blackboard font-sans">

    <!-- 頂部導覽列 (支援手機自動換行) -->
    <nav class="nav-wood shadow-md">
        <div class="w-full px-4 sm:px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <h1 class="text-xl sm:text-2xl font-bold tracking-wide flex items-center gap-2">
                <span>📝</span> 智慧線上聯絡簿
            </h1>
            <div class="flex flex-wrap justify-center gap-2 sm:gap-3 items-center w-full sm:w-auto">
                <button id="btn-frontend" onclick="switchView('frontend')" class="flex-1 sm:flex-none px-4 py-2 rounded-xl font-medium tab-btn-active shadow transition-all duration-200 cursor-pointer text-sm sm:text-base">
                    🏠 前台
                </button>
                <button id="btn-backend" onclick="tryAccessBackend()" class="flex-1 sm:flex-none px-4 py-2 rounded-xl font-medium tab-btn transition-all duration-200 cursor-pointer text-sm sm:text-base">
                    ⚙️ 後台
                </button>
                <!-- 全螢幕切換 -->
                <button id="btn-fullscreen" onclick="toggleFullscreen()" class="flex-1 sm:flex-none px-4 py-2 rounded-xl font-medium tab-btn transition-all duration-200 cursor-pointer text-sm sm:text-base">
                    ⛶ 全螢幕
                </button>
                <!-- 登出按鈕（預設隱藏，登入後顯示） -->
                <button id="btn-logout" onclick="handleLogout()" class="hidden chalk-btn chalk-btn-pink px-3 py-2 rounded-xl font-medium transition cursor-pointer text-sm sm:text-base" style="background: rgba(63, 42, 24, 0.55);">
                    🚪 登出
                </button>
            </div>
        </div>
    </nav>

    <!-- 主要內容區（撐滿整個畫面） -->
    <main class="fullscreen-main px-4 sm:px-6 py-4 sm:py-6">

        <!-- ================= 前台介面 ================= -->
        <section id="view-frontend" class="grid grid-cols-1 md:grid-cols-[16rem_1fr] gap-4 sm:gap-6 items-stretch">
            
            <!-- 查詢功能（手機版排列於上方，電腦版置於左側） -->
            <div class="chalk-panel p-5 sm:p-6 md:self-start">
                <h2 class="text-lg sm:text-xl font-bold mb-4 flex items-center gap-2 chalk-title">🔍 查詢歷史</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm chalk-dim mb-1">選擇日期：</label>
                        <input type="date" id="search-date" class="chalk-input w-full p-3 rounded-xl text-base">
                    </div>
                    <button onclick="searchContactBook()" class="chalk-btn chalk-btn-yellow w-full py-3 rounded-xl font-bold text-base transition cursor-pointer">
                        搜尋特定日期
                    </button>
                    <button onclick="renderFrontendOnlyLatest()" class="chalk-btn chalk-btn-gray w-full py-2.5 rounded-xl font-bold text-base transition cursor-pointer">
                        返回今日/最新
                    </button>
                </div>
            </div>

            <!-- 聯絡簿內容顯示區（直式，佔滿剩餘空間） -->
            <div id="frontend-content" class="w-full min-w-0">
                <div class="chalk-empty text-lg sm:text-xl">資料載入中...</div>

        </section>


        <!-- ================= 後台介面 ================= -->
        <section id="view-backend" class="hidden space-y-8 w-full max-w-7xl mx-auto">
            <!-- 發布/修改新聯絡簿表單 -->
            <div class="chalk-panel p-6 sm:p-8">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-6">
                    <h2 id="form-title" class="text-xl sm:text-2xl font-bold chalk-title">➕ 發布預排聯絡簿</h2>
                    <button id="btn-cancel-edit" onclick="cancelEdit()" class="hidden chalk-btn chalk-btn-gray px-4 py-2 rounded-xl text-sm font-medium transition cursor-pointer">
                        ❌ 取消修改
                    </button>
                </div>
                
                <form id="contact-form" onsubmit="handlePublish(event)" class="space-y-6">
                    <div>
                        <label class="block text-base sm:text-lg font-medium chalk-text mb-2">日期 (若設定未來日期，當天到才會自動公開)</label>

                    <div>
                        <label class="block text-base sm:text-lg font-medium chalk-text mb-2">今日作業 (每行一項)</label>
                        <textarea id="form-homework" rows="4" required placeholder="1. 數學課本 P.10-P.12&#10;2. 英文單字 L3 背誦" class="chalk-input w-full p-3 sm:p-3.5 text-base sm:text-lg rounded-xl"></textarea>
                    </div>
                    <div>
                        <label class="block text-base sm:text-lg font-medium chalk-text mb-2">老師的話 / 宣導事項</label>
                        <textarea id="form-note" rows="4" placeholder="下週有期中考，請各位同學提早複習。" class="chalk-input w-full p-3 sm:p-3.5 text-base sm:text-lg rounded-xl"></textarea>
                    </div>
                    <button type="submit" id="btn-submit" class="chalk-btn chalk-btn-green w-full py-3.5 sm:py-4 rounded-xl font-bold text-lg sm:text-xl transition cursor-pointer">
                        儲存 / 發布聯絡簿

            </div>

            <!-- 後台歷史列表與管理 -->
            <div class="chalk-panel p-6 sm:p-8">
                <h2 class="text-xl sm:text-2xl font-bold mb-6 chalk-title">🗂️ 歷史聯絡簿管理（全部列表）</h2>
                <div class="overflow-x-auto">

                                <th class="pb-4 font-medium">摘要內容</th>
                                <th class="pb-4 font-medium text-center">發布狀態</th>
                                <th class="pb-4 font-medium text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody id="backend-table-body" class="text-base sm:text-lg">

                        </tbody>

        </section>

    </main>

    <!-- ================= 老師登入燈箱 (Login Modal) ================= -->
    <div id="login-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="modal-card w-full max-w-md rounded-2xl overflow-hidden transform transition-all">

                <h3 class="text-xl font-bold">🔐 老師權限驗證</h3>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, getDocs, deleteDoc, updateDoc, collection, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase 配置資料
        const firebaseConfig = {
            apiKey: "AIzaSyCS8ZfMpT6mwysRMyCRKuHeL_NXpKBMeLw",
            authDomain: "homework-f9997.firebaseapp.com",
            projectId: "homework-f9997",
            storageBucket: "homework-f9997.firebasestorage.app",
            messagingSenderId: "603924060339",
            appId: "1:603924060339:web:7b840a53428f6ee029f8c6",
            measurementId: "G-6KCNQ6E40P"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let isEditing = false;
        let isLoggedIn = false;
        let currentEditItem = null;

        window.isEditing = isEditing;
        window.isLoggedIn = isLoggedIn;
        window.tryAccessBackend = tryAccessBackend;
        window.openLoginModal = openLoginModal;
        window.closeLoginModal = closeLoginModal;
        window.handleLoginSubmit = handleLoginSubmit;
        window.handleLogout = handleLogout;
        window.switchView = switchView;
        window.renderFrontendOnlyLatest = renderFrontendOnlyLatest;
        window.searchContactBook = searchContactBook;
        window.startEdit = startEdit;
        window.cancelEdit = cancelEdit;
        window.handlePublish = handlePublish;
        window.toggleManualHide = toggleManualHide;
        window.deleteItem = deleteItem;
        window.toggleFullscreen = toggleFullscreen;

        document.getElementById('form-date').valueAsDate = new Date();

        // 全螢幕切換
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                const el = document.documentElement;
                if (el.requestFullscreen) {
                    el.requestFullscreen().catch((err) => console.error("無法進入全螢幕: ", err));
                }
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }

        document.addEventListener('fullscreenchange', () => {
            document.getElementById('btn-fullscreen').innerText = document.fullscreenElement ? '🗗 離開全螢幕' : '⛶ 全螢幕';
        });

        // 取得今日 YYYY-MM-DD 字串 (用以比較日期是否已到)
        function getTodayString() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 日期顯示格式：115年10月23日星期五（民國年）
        function convertToTaiwanDate(dateStr) {
            if (!dateStr) return '無';

            let year, month, day;
            const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(dateStr);
            if (m) {
                year = parseInt(m[1], 10);
                month = parseInt(m[2], 10);
                day = parseInt(m[3], 10);
            } else {
                const dateObj = new Date(dateStr);
                if (isNaN(dateObj.getTime())) return dateStr;
                year = dateObj.getFullYear();
                month = dateObj.getMonth() + 1;
                day = dateObj.getDate();
            }

            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekDayStr = weekDays[new Date(year, month - 1, day).getDay()];

            return `${year - 1911}年${month}月${day}日${weekDayStr}`;
        }

        function formatText(text) {
            return text ? text.replace(/\n/g, '<br>') : '無';
        }

        // 直式排版用：
        //   1. 「英文字母 + 數字」的組合（如 P23、CH6、L8、P1000、CH50）→ 放在同一格橫排
        //   2. 單獨的英文字母 → 每個字母直立
        //   3. 單獨的數字 → 橫排成一格
        // （會略過 HTML 標籤與 &xxx; 符號，避免破壞原有內容）
        function formatVertical(text) {
            return String(text)
                .split(/(<[^>]*>|&[#\w]+;)/)
                .map((part) => {
                    if (part.startsWith('<') || /^&[#\w]+;$/.test(part)) return part;
                    return part.replace(/([A-Za-z]+)(\d+)|([A-Za-z]+)|(\d+)/g, (m, codeLetters, codeDigits, letters, digits) => {
                        if (codeLetters) {
                            // 太長的組合（超過 5 個字元）不硬擠，改為字母直立 + 數字橫排
                            if (m.length <= 5) {
                                return `<span class="v-code">${m}</span>`;
                            }
                            return `<span class="v-latin">${codeLetters}</span><span class="v-num">${codeDigits}</span>`;
                        }
                        if (letters) return `<span class="v-latin">${letters}</span>`;
                        return `<span class="v-num">${digits}</span>`;
                    });
                })
                .join('');
        }

        function formatVerticalText(text) {
            return formatVertical(formatText(text));
        }

        // 判斷該項目在前台是否應該被顯示
        function isVisibleToPublic(item) {
            const today = getTodayString();
            // 條件 1: 未手動隱藏
            // 條件 2: 紀錄日期 <= 今天 (當天或過去日期才可以顯示)
            return !item.isManualHidden && (item.date <= today);
        }

        function tryAccessBackend() {
            if (window.isLoggedIn) {
                switchView('backend');
            } else {
                openLoginModal();
            }
        }

        function openLoginModal() {
            document.getElementById('login-modal').classList.remove('hidden');
            document.getElementById('login-error').classList.add('hidden');
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
        }

        function closeLoginModal() {
            document.getElementById('login-modal').classList.add('hidden');
        }

        function handleLoginSubmit(e) {
            e.preventDefault();
            const user = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-password').value.trim();

            if (user === 'walan52' && pass === 'source88') {
                window.isLoggedIn = true;
                closeLoginModal();
                document.getElementById('btn-logout').classList.remove('hidden');
                switchView('backend');
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function handleLogout() {
            window.isLoggedIn = false;
            document.getElementById('btn-logout').classList.add('hidden');
            alert('您已成功登出後台管理系統。');
            switchView('frontend');
        }

        function switchView(view) {
            const frontSec = document.getElementById('view-frontend');
            const backSec = document.getElementById('view-backend');
            const btnFront = document.getElementById('btn-frontend');
            const btnBack = document.getElementById('btn-backend');

            if (view === 'frontend') {
                frontSec.classList.remove('hidden');
                frontSec.classList.add('grid');
                backSec.classList.add('hidden');
                btnFront.className = "flex-1 sm:flex-none px-4 py-2 rounded-xl font-medium tab-btn-active shadow cursor-pointer text-sm sm:text-base";
                btnBack.className = "flex-1 sm:flex-none px-4 py-2 rounded-xl font-medium tab-btn transition cursor-pointer text-sm sm:text-base";
                cancelEdit();
                renderFrontendOnlyLatest();
            } else {
                frontSec.classList.add('hidden');
                frontSec.classList.remove('grid');
                backSec.classList.remove('hidden');
                btnFront.className = "flex-1 sm:flex-none px-4 py-2 rounded-xl font-medium tab-btn transition cursor-pointer text-sm sm:text-base";
                btnBack.className = "flex-1 sm:flex-none px-4 py-2 rounded-xl font-medium tab-btn-active shadow cursor-pointer text-sm sm:text-base";
                renderBackend();
            }
        }

        // 前台：自動過濾「未到日期」與「手動隱藏」的項目，只抓出最新的合格項目
        async function renderFrontendOnlyLatest() {
            const container = document.getElementById('frontend-content');
            container.innerHTML = `<div class="chalk-empty text-lg sm:text-xl">資料載入中...</div>`;
            document.getElementById('search-date').value = '';

            try {
                // 抓取近 20 筆資料，再由前端動態確認日期與狀態
                const q = query(collection(db, "contactBook"), orderBy("date", "desc"), limit(20));
                const querySnapshot = await getDocs(q);
                const validData = [];
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (isVisibleToPublic(data)) {
                        validData.push(data);
                    }
                });
                
                // 只呈現第一筆（即最新的合格項目）
                renderFrontendHTML(validData.slice(0, 1), true);
            } catch (error) {
                console.error("讀取資料失敗: ", error);
                container.innerHTML = `<div class="chalk-empty chalk-error text-lg sm:text-xl">資料載入失敗，請確認 Firebase 安全規則設定。</div>`;
            }
        }

        // 前台搜尋：若該日期尚未到或被強制隱藏，則提示查無資料
        async function searchContactBook() {
            const searchDate = document.getElementById('search-date').value;
            if (!searchDate) {
                alert('請選擇要查詢的日期！');
                return;
            }
            const container = document.getElementById('frontend-content');
            container.innerHTML = `<div class="chalk-empty text-lg sm:text-xl">搜尋中...</div>`;

            try {
                const docRef = doc(db, "contactBook", searchDate);
                const docSnap = await getDoc(docRef);
                const result = [];
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (isVisibleToPublic(data)) {
                        result.push(data);
                    }
                }
                renderFrontendHTML(result, false);
            } catch (error) {
                console.error("搜尋失敗: ", error);
                container.innerHTML = `<div class="chalk-empty chalk-error text-lg sm:text-xl">搜尋發生錯誤。</div>`;
            }
        }

        function renderFrontendHTML(data, isLatestMode) {
            const container = document.getElementById('frontend-content');

            if (data.length === 0) {
                container.innerHTML = `<div class="chalk-empty text-lg sm:text-xl">今日無聯絡簿或資料尚未到達發布日期</div>`;
                return;
            }

            // 直式排版：由右至左依序為「日期」→「今日作業」→「老師的話」
            container.innerHTML = data.map(item => `
                <div class="chalk-panel v-card shadow-md w-full">
                    <div class="v-head">
                        <span class="v-date chalk-title font-bold text-3xl sm:text-4xl md:text-5xl">📅 ${formatVertical(convertToTaiwanDate(item.date))}</span>
                        <span class="badge text-xs sm:text-sm ${isLatestMode ? 'badge-green' : 'badge-yellow'} px-3 sm:px-4 py-1.5 rounded-full font-bold">
                            ${isLatestMode ? '最新聯絡簿' : '歷史查詢結果'}
                        </span>
                    </div>
                    <div class="v-section">
                        <h4 class="font-bold chalk-green text-lg sm:text-xl">📝 今日作業</h4>
                        <p class="handwriting-font v-text v-hw chalk-text text-2xl sm:text-3xl md:text-5xl font-bold leading-relaxed tracking-wide">${formatVerticalText(item.homework)}</p>
                    </div>
                    <div class="v-divider"></div>
                    <div class="v-section">
                        <h4 class="font-bold chalk-blue text-lg sm:text-xl">💬 老師的話</h4>
                        <p class="handwriting-font v-text v-note chalk-text text-2xl sm:text-3xl md:text-5xl font-bold leading-relaxed tracking-wide">${formatVerticalText(item.note)}</p>
                    </div>
                </div>
            `).join('');
        }

        // 後台管理列表：顯示各種發布狀態（已發布、預排等待中、手動關閉）
        async function renderBackend() {
            const tbody = document.getElementById('backend-table-body');
            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 chalk-dim">資料加載中...</td></tr>`;

            const today = getTodayString();

            try {
                const q = query(collection(db, "contactBook"), orderBy("date", "desc"));
                const querySnapshot = await getDocs(q);
                const data = [];
                querySnapshot.forEach((doc) => {
                    data.push(doc.data());
                });

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 chalk-dim">目前沒有任何發布紀錄</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.map((item) => {
                    const isManualHidden = item.isManualHidden || false;
                    const isFuture = item.date > today;

                    // 計算狀態標籤
                    let statusBadge = '';
                    if (isManualHidden) {
                        statusBadge = `<span class="badge badge-pink text-xs sm:text-sm px-2.5 py-1 rounded-full font-bold">🙈 手動關閉</span>`;
                    } else if (isFuture) {
                        statusBadge = `<span class="badge badge-yellow text-xs sm:text-sm px-2.5 py-1 rounded-full font-bold">⏳ 預排中 (${convertToTaiwanDate(item.date)})</span>`;
                    } else {
                        statusBadge = `<span class="badge badge-green text-xs sm:text-sm px-2.5 py-1 rounded-full font-bold">👁️ 已公開</span>`;
                    }

                    return `
                        <tr class="chalk-row ${isManualHidden || isFuture ? 'chalk-row-dim' : ''}">
                            <td class="py-4 sm:py-5 font-medium chalk-text text-sm sm:text-lg">${convertToTaiwanDate(item.date)}</td>
                            <td class="py-4 sm:py-5 chalk-dim text-sm sm:text-base max-w-[120px] sm:max-w-md truncate">${item.homework ? item.homework.split('\n')[0] : ''}...</td>
                            <td class="py-4 sm:py-5 text-center">
                                ${statusBadge}
                            </td>
                            <td class="py-4 sm:py-5 text-right space-x-1 sm:space-x-2">
                                <button onclick="toggleManualHide('${item.date}', ${isManualHidden})" class="${isManualHidden ? 'act-green' : 'act-yellow'} font-bold transition px-2 sm:px-3 py-1.5 rounded cursor-pointer text-sm sm:text-base">
                                    ${isManualHidden ? '開啟' : '強制關閉'}
                                </button>
                                <button onclick="startEdit('${item.date}')" class="act-blue font-bold transition px-2 sm:px-3 py-1.5 rounded cursor-pointer text-sm sm:text-base">
                                    修改
                                </button>
                                <button onclick="deleteItem('${item.date}')" class="act-pink font-bold transition px-2 sm:px-3 py-1.5 rounded cursor-pointer text-sm sm:text-base">
                                    刪除
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                console.error("讀取後台列表失敗: ", error);
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 chalk-error">載入失敗。</td></tr>`;
            }
        }

        // 切換手動隱藏狀態
        async function toggleManualHide(dateStr, currentManualHidden) {
            try {
                const docRef = doc(db, "contactBook", dateStr);
                await updateDoc(docRef, {
                    isManualHidden: !currentManualHidden
                });
                renderBackend();
            } catch (error) {
                console.error("更新狀態失敗: ", error);
                alert("更新狀態失敗！");
            }
        }

        async function startEdit(dateStr) {
            try {
                const docRef = doc(db, "contactBook", dateStr);
                const docSnap = await getDoc(docRef);
                if (!docSnap.exists()) return;
                
                const record = docSnap.data();
                window.isEditing = true;
                currentEditItem = record;

                document.getElementById('form-date').value = record.date;
                document.getElementById('form-date').disabled = true;
                document.getElementById('form-homework').value = record.homework;
                document.getElementById('form-note').value = record.note;

                document.getElementById('form-title').innerText = `✏️ 修改聯絡簿內容 (${convertToTaiwanDate(dateStr)})`;
                document.getElementById('btn-cancel-edit').classList.remove('hidden');
                
                const btnSubmit = document.getElementById('btn-submit');
                btnSubmit.innerText = "更新聯絡簿資料";
                btnSubmit.className = "chalk-btn chalk-btn-blue w-full py-3.5 sm:py-4 rounded-xl font-bold text-lg sm:text-xl transition cursor-pointer";
                
                document.getElementById('form-title').scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                console.error("獲取修改資料失敗: ", error);
            }
        }

        function cancelEdit() {
            window.isEditing = false;
            currentEditItem = null;
            
            document.getElementById('form-date').disabled = false;
            document.getElementById('form-date').valueAsDate = new Date();
            document.getElementById('form-homework').value = '';
            document.getElementById('form-note').value = '';

            document.getElementById('form-title').innerText = "➕ 發布預排聯絡簿";
            document.getElementById('btn-cancel-edit').classList.add('hidden');
            
            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.innerText = "儲存 / 發布聯絡簿";
            btnSubmit.className = "chalk-btn chalk-btn-green w-full py-3.5 sm:py-4 rounded-xl font-bold text-lg sm:text-xl transition cursor-pointer";
        }

        async function handlePublish(e) {
            e.preventDefault();
            const date = document.getElementById('form-date').value;
            const homework = document.getElementById('form-homework').value;
            const note = document.getElementById('form-note').value;
            const today = getTodayString();

            try {
                const docRef = doc(db, "contactBook", date);
                
                if (window.isEditing) {
                    const isManualHidden = currentEditItem && currentEditItem.isManualHidden ? currentEditItem.isManualHidden : false;
                    await setDoc(docRef, { date, homework, note, isManualHidden });
                    alert('資料更新成功！');
                    cancelEdit();
                } else {
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        if (!confirm(`${convertToTaiwanDate(date)} 已經有聯絡簿紀錄，確定要覆蓋更新嗎？`)) {
                            return;
                        }
                    }
                    
                    await setDoc(docRef, { date, homework, note, isManualHidden: false });
                    
                    if (date > today) {
                        alert(`發布成功！\n因為您設定的日期是未來的 (${convertToTaiwanDate(date)})，前台將會在當天自動公開顯現。`);
                    } else {
                        alert('發布成功！已在台公開顯現。');
                    }
                    
                    document.getElementById('form-homework').value = '';
                    document.getElementById('form-note').value = '';
                }

                renderBackend();
            } catch (error) {
                console.error("發布失敗: ", error);
                alert("儲存至資料庫時發生錯誤！");
            }
        }

        async function deleteItem(date) {
            if (window.isEditing && document.getElementById('form-date').value === date) {
                alert('此聯絡簿正在修改中，請先取消修改或完成更新後再行刪除。');
                return;
            }

            if (confirm(`確定要刪除 ${convertToTaiwanDate(date)} 的聯絡簿嗎？\n刪除後前台將無法搜尋到此篇紀錄。`)) {
                try {
                    await deleteDoc(doc(db, "contactBook", date));
                    alert("刪除成功！");
                    renderBackend();
                } catch (error) {
                    console.error("刪除失敗: ", error);
                    alert("刪除失敗，請檢查權限。");
                }
            }
        }

        renderFrontendOnlyLatest();
    </script>
</body>
</html>
