                                                    {diceValue}
                                                </div>
                                            </div>

                                            <button
                                                onClick={rollDice}
                                                disabled={phase !== 'IDLE' || players[currentPlayerIdx]?.isAi}
                                                className={`px-5 py-2 rounded-xl font-extrabold text-xs shadow-xl transition transform active:scale-95 flex items-center gap-1.5 ${
                                                    phase === 'IDLE' && !players[currentPlayerIdx]?.isAi
                                                        ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 glow-gold cursor-pointer'
                                                        : 'bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed'
                                                }`}>
                                                <i className="fa-solid fa-dice text-sm"></i>
                                                {players[currentPlayerIdx]?.isAi ? '同組同學思考擲骰中...' : '點擊擲骰子'}
                                            </button>
                                        </div>

                                        <div className="bg-slate-900/80 rounded-xl p-1.5 border border-slate-800 text-center text-[10px] sm:text-xs text-slate-300">
                                            {phase === 'IDLE' && `輪到 ${players[currentPlayerIdx]?.name} 擲骰進攻！`}
                                            {phase === 'QUIZ' && '請在手寫面板繪製正字！'}
                                            {phase === 'MOVING' && '棋子移動中...'}
                                        </div>
                                    </div>

                                </div>
                            </div>

                            {/* Sidebar Info & Stats */}
                            <div className="lg:col-span-4 flex flex-col gap-2">
                                
                                <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-3 shadow-xl">
                                    <h3 className="text-xs font-extrabold text-slate-300 uppercase mb-2 flex items-center gap-1.5">
                                        <i className="fa-solid fa-users text-indigo-400"></i> 本組隊員 ({players.length} 人組)
                                    </h3>

                                    <div className="space-y-1.5">
                                        {players.map((p, idx) => (
                                            <div
                                                key={p.id}
                                                className={`p-2 rounded-xl border transition ${
                                                    idx === currentPlayerIdx ? 'bg-indigo-950/60 border-indigo-500/80' : 'bg-slate-800/50 border-slate-700/50'
                                                }`}>
                                                <div className="flex items-center justify-between">
                                                    <div className="flex items-center gap-2">
                                                        <div className={`w-6 h-6 rounded-lg ${p.avatar.color} flex items-center justify-center text-white text-[10px]`}>
                                                            <i className={`fa-solid ${p.avatar.icon}`}></i>
                                                        </div>
                                                        <div>
                                                            <div className="text-xs font-bold text-white flex items-center gap-1">
                                                                {p.name}
                                                                {p.name === studentNickname && <span className="px-1 bg-indigo-500/30 text-indigo-300 text-[8px] rounded">自己</span>}
                                                            </div>
                                                            <div className="text-[9px] text-slate-400">
                                                                手寫正確率: {p.stats.total > 0 ? Math.round((p.stats.correct / p.stats.total) * 100) : 0}%
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <div className="text-right">
                                                        <div className="text-xs font-black text-amber-400">${p.coins}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Event Log Stream */}
                                <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-3 shadow-xl flex-1 flex flex-col min-h-[220px]">
                                    <h3 className="text-xs font-extrabold text-slate-300 uppercase mb-2 flex items-center gap-1.5">
                                        <i className="fa-solid fa-list-ul text-purple-400"></i> 對戰歷程記錄
                                    </h3>

                                    <div className="flex-1 overflow-y-auto space-y-1.5 pr-1 max-h-[220px]">
                                        {logs.map(log => (
                                            <div key={log.id} className="text-[10px] p-1.5 rounded-lg bg-slate-950/60 border border-slate-800/60 flex items-start gap-1.5">
                                                <span className="text-[9px] text-slate-500 font-mono">{log.time}</span>
                                                <span className={`flex-1 ${
                                                    log.type === 'success' ? 'text-emerald-300 font-medium' :
                                                    log.type === 'danger' ? 'text-rose-300 font-medium' :
                                                    log.type === 'warning' ? 'text-amber-300 font-medium' :
                                                    log.type === 'action' ? 'text-purple-300 font-medium' : 'text-slate-300'
                                                }`}>
                                                    {log.msg}
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                            </div>
                        </div>
                    )}

                    {/* ========================================== */}
                    {/* MODALS                                     */}
                    {/* ========================================== */}

                    {/* HANDWRITING QUIZ MODAL */}
                    {activeQuiz && (
                        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-3 z-50 overflow-y-auto">
                            <div className="bg-slate-900 border border-slate-700 rounded-3xl p-4 sm:p-5 max-w-lg w-full shadow-2xl relative my-auto">
                                
                                <div className="flex items-center justify-between border-b border-slate-800 pb-2 mb-3">
                                    <span className="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-400/30 text-[11px] font-bold">
                                        {activeQuiz.question.category}
                                    </span>
                                    <span className="text-xs font-bold text-amber-400">
                                        答對獎勵: ${activeQuiz.question.reward}
                                    </span>
                                </div>

                                {/* Question Sentence */}
                                <div className="mb-3 text-center">
                                    <h3 className="text-xs font-bold text-slate-400 mb-1">請在手寫面板繪製句中錯字的「正字」：</h3>
                                    <div className="p-3 rounded-xl bg-slate-950 border border-slate-800 text-xs sm:text-sm font-semibold text-slate-200 leading-relaxed">
                                        {activeQuiz.question.sentence.split(activeQuiz.question.wrongChar).map((part, idx, arr) => (
                                            <React.Fragment key={idx}>
                                                {part}
                                                {idx < arr.length - 1 && (
                                                    <span className="inline-block px-1.5 py-0.5 mx-0.5 rounded bg-rose-500/30 text-rose-300 border border-rose-400/60 font-black animate-pulse">
                                                        {activeQuiz.question.wrongChar}
                                                    </span>
                                                )}
                                            </React.Fragment>
                                        ))}
                                    </div>
                                </div>

                                {/* Handwriting Canvas */}
                                {quizResult === null ? (
                                    <HandwritingBoard
                                        correctChar={activeQuiz.question.correctChar}
                                        onSelectCandidate={handleHandwritingSubmit}
                                        soundEnabled={soundEnabled}
                                        isAi={players[currentPlayerIdx]?.isAi}
                                        onAiSimulate={handleAiSimulateHandwriting}
                                    />
                                ) : (
                                    <div className="space-y-3">
                                        <div className={`p-3 rounded-2xl border text-xs sm:text-sm ${
                                            quizResult.correct ? 'bg-emerald-950/60 border-emerald-500/80 text-emerald-200' : 'bg-rose-950/60 border-rose-500/80 text-rose-200'
                                        }`}>
                                            <div className="font-extrabold flex items-center gap-1.5 mb-1">
                                                <i className={`fa-solid ${quizResult.correct ? 'fa-circle-check text-emerald-400' : 'fa-circle-xmark text-rose-400'}`}></i>
                                                {quizResult.message}
                                            </div>
                                            <div className="text-xs opacity-90 leading-relaxed mt-1">
                                                <strong>【解析】：</strong> {quizResult.explanation}
                                            </div>
                                        </div>

                                        {/* Property Buying / Upgrading Action Card */}
                                        {quizResult.correct && (
                                            <div>
                                                {!activeQuiz.owner && (
                                                    <div className="bg-slate-950 p-3 rounded-2xl border border-amber-500/50 flex items-center justify-between gap-2">
                                                        <div>
                                                            <div className="text-xs font-bold text-white">購入地產【{activeQuiz.tile.name}】</div>
                                                            <div className="text-[10px] text-slate-400">價格: ${activeQuiz.tile.price} | 起始過路費: ${activeQuiz.tile.rent}</div>
                                                        </div>
                                                        <button
                                                            onClick={handleBuyProperty}
                                                            disabled={players[currentPlayerIdx]?.coins < activeQuiz.tile.price}
                                                            className="px-3 py-1.5 rounded-xl text-xs font-bold bg-amber-500 hover:bg-amber-600 text-slate-950 transition disabled:opacity-40">
                                                            購入 (LV1)
                                                        </button>
                                                    </div>
                                                )}

                                                {activeQuiz.owner && activeQuiz.owner.id === players[currentPlayerIdx].id && (activeQuiz.propData?.level || 1) < 3 && (
                                                    <div className="bg-slate-950 p-3 rounded-2xl border border-indigo-500/50 flex items-center justify-between gap-2">
                                                        <div>
                                                            <div className="text-xs font-bold text-white">升級【{activeQuiz.tile.name}】建築</div>
                                                            <div className="text-[10px] text-slate-400">升級費: ${Math.round(activeQuiz.tile.price * 0.6)} | 當前等級: LV{activeQuiz.propData?.level || 1}</div>
                                                        </div>
                                                        <button
                                                            onClick={handleUpgradeProperty}
                                                            disabled={players[currentPlayerIdx]?.coins < Math.round(activeQuiz.tile.price * 0.6)}
                                                            className="px-3 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white transition disabled:opacity-40">
                                                            升級至 LV{(activeQuiz.propData?.level || 1) + 1}
                                                        </button>
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        <button
                                            onClick={closeQuizModal}
                                            className="w-full py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs transition border border-slate-700">
                                            結束回合
                                        </button>
                                    </div>
                                )}

                            </div>
                        </div>
                    )}

                    {/* Chance / Fate Modal */}
                    {activeChance && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 border border-purple-500/50 rounded-3xl p-5 max-w-md w-full text-center shadow-2xl">
                                <div className="w-12 h-12 rounded-2xl bg-purple-500/20 text-purple-400 border border-purple-400/30 flex items-center justify-center text-2xl mx-auto mb-2">
                                    <i className="fa-solid fa-bolt"></i>
                                </div>
                                <h3 className="text-lg font-black text-white mb-1">{activeChance.event.title}</h3>
                                <p className="text-xs text-slate-300 my-3 leading-relaxed bg-slate-950 p-3 rounded-xl border border-slate-800">
                                    {activeChance.event.text}
                                </p>
                                <button
                                    onClick={() => { setActiveChance(null); nextTurn(); }}
                                    className="w-full py-2 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs transition">
                                    確認並繼續
                                </button>
                            </div>
                        </div>
                    )}

                    {/* ADMIN SETTINGS & QUESTION BANK MODAL */}
                    {showAdminModal && (
                        <AdminModal
                            rooms={rooms}
                            onDeleteRoom={handleDeleteRoom}
                            onClearAllRooms={handleClearAllRooms}
                            onLaunchGame={(r) => {
                                const updatedRoom = { ...r, status: 'PLAYING' };
                                db.ref(`rooms/${r.id}`).set(updatedRoom);
                            }}
                            questions={questions}
                            setQuestions={updateQuestionsBank}
                            onClose={() => setShowAdminModal(false)}
                        />
                    )}

                    {/* End Game Modal */}
                    {appState === 'GAME_OVER' && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-900 border border-amber-500/60 rounded-3xl p-6 max-w-md w-full text-center shadow-2xl">
                                <div className="w-16 h-16 rounded-full bg-amber-500/20 border border-amber-400 text-amber-400 flex items-center justify-center text-3xl mx-auto mb-3 glow-gold">
                                    <i className="fa-solid fa-trophy"></i>
                                </div>
                                <h2 className="text-xl font-black text-white mb-1">9x9 改錯字大富翁結算</h2>
                                <p className="text-xs text-slate-400 mb-4">最終國學手寫戰力與資產結算</p>

                                <div className="space-y-2 mb-5">
                                    {([...players].sort((a, b) => b.coins - a.coins)).map((p, rank) => (
                                        <div key={p.id} className="p-2.5 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-between">
                                            <div className="flex items-center gap-2">
                                                <span className="w-5 h-5 rounded-full bg-amber-400 text-slate-950 font-black text-xs flex items-center justify-center">
                                                    {rank + 1}
                                                </span>
                                                <span className="font-bold text-xs text-white">{p.name}</span>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-xs font-black text-amber-400">${p.coins}</div>
                                                <div className="text-[9px] text-slate-400">
                                                    手寫正確率: {p.stats.total > 0 ? Math.round((p.stats.correct / p.stats.total) * 100) : 0}%
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <button
                                    onClick={resetToLogin}
                                    className="w-full py-2.5 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-extrabold text-xs shadow-xl transition">
                                    返回登入頁面
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        // ==========================================
        // 6. ADMIN MODAL COMPONENT (Password: source88)
        // ==========================================
        function AdminModal({ rooms, onDeleteRoom, onClearAllRooms, onLaunchGame, questions, setQuestions, onClose }) {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [passwordInput, setPasswordInput] = useState("");
            const [passwordError, setPasswordError] = useState(false);

            const [activeTab, setActiveTab] = useState("rooms"); // 'rooms', 'excel_io', 'csv_import', 'json_import', 'list'
            const [csvText, setCsvText] = useState("");
            const [jsonText, setJsonText] = useState("");

            // State for Editing Single Question
            const [editingQuestion, setEditingQuestion] = useState(null);

            const handleLoginAdmin = (e) => {
                e.preventDefault();
                if (passwordInput === "source88") {
                    setIsAuthenticated(true);
                    setPasswordError(false);
                } else {
                    setPasswordError(true);
                }
            };

            // Save Question Edit Handler
            const handleSaveEditQuestion = (e) => {
                e.preventDefault();
                if (!editingQuestion) return;
                const updatedQuestions = questions.map(q => q.id === editingQuestion.id ? editingQuestion : q);
                setQuestions(updatedQuestions);
                setEditingQuestion(null);
                alert("題目修改成功並已即時同步至雲端！");
            };

            // Excel Import Handler
            const handleExcelFileSelect = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const workbook = XLSX.read(bstr, { type: 'binary' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                        if (!jsonData || jsonData.length === 0) {
                            alert("檔案內容為空！");
                            return;
                        }

                        let startRow = 0;
                        const firstRowStr = JSON.stringify(jsonData[0]);
                        if (firstRowStr.includes("類別") || firstRowStr.includes("句子") || firstRowStr.includes("錯字") || firstRowStr.includes("正字")) {
                            startRow = 1;
                        }

                        const newParsed = [];
                        for (let i = startRow; i < jsonData.length; i++) {
                            const row = jsonData[i];
                            if (!row || row.length < 2) continue;

                            const category = row[0] ? String(row[0]).trim() : "常用錯別字";
                            const sentence = row[1] ? String(row[1]).trim() : "";
                            const wrongChar = row[2] ? String(row[2]).trim() : "";
                            const correctChar = row[3] ? String(row[3]).trim() : "";
                            const explanation = row[4] ? String(row[4]).trim() : `正確正字為「${correctChar}」。`;
                            const reward = row[5] ? (parseInt(row[5], 10) || 120) : 120;

                            if (sentence && correctChar) {
                                newParsed.push({
                                    id: Date.now() + i + Math.random(),
                                    category,
                                    sentence,
                                    wrongChar: wrongChar || "?",
                                    correctChar,
                                    explanation,
                                    reward
                                });
                            }
                        }

                        if (newParsed.length > 0) {
                            setQuestions([...questions, ...newParsed]);
                            alert(`成功自 Excel 匯入 ${newParsed.length} 道題目並同步至雲端！`);
                            e.target.value = "";
                            setActiveTab("list");
                        } else {
                            alert("未解析到有效題目，請確保 Excel 表格格式包含：類別, 完整句子, 錯字, 正字, 解析說明, 獎勵金額");
                        }
                    } catch (err) {
                        console.error(err);
                        alert("讀取 Excel 檔案失敗，請確保檔案格式為 .xlsx 或 .xls！");
                    }
                };
                reader.readAsBinaryString(file);
            };

            // Excel Export Handler
            const handleExportExcel = () => {
                if (!questions || questions.length === 0) {
                    alert("目前雲端題庫沒有題目可供匯出！");
                    return;
                }

                const exportData = questions.map(q => ({
                    "類別": q.category || "常用錯別字",
                    "完整句子": q.sentence || "",
                    "錯字": q.wrongChar || "",
                    "正字": q.correctChar || "",
                    "解析說明": q.explanation || "",
                    "獎勵金額": q.reward || 120
                }));

                const worksheet = XLSX.utils.json_to_sheet(exportData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "題庫");
                const today = new Date().toISOString().slice(0, 10);
                XLSX.writeFile(workbook, `改錯字大富翁題庫_${today}.xlsx`);
            };

            // CSV Batch Import Handler
            const handleBatchCsvImport = () => {
                if (!csvText.trim()) return;
                const lines = csvText.trim().split("\n");
                const newParsed = [];

                lines.forEach((line, idx) => {
                    const row = line.split(",").map(s => s.trim());
                    if (row.length >= 4) {
                        newParsed.push({
                            id: Date.now() + idx + Math.random(),
                            category: row[0] || "常用錯別字",
                            sentence: row[1],
                            wrongChar: row[2],
                            correctChar: row[3],
                            explanation: row[4] || `正確正字為「${row[3]}」。`,
                            reward: parseInt(row[5], 10) || 130
                        });
                    }
                });

                if (newParsed.length > 0) {
                    setQuestions([...questions, ...newParsed]);
                    alert(`批次匯入成功！共新增 ${newParsed.length} 道題目。`);
                    setCsvText("");
                    setActiveTab("list");
                } else {
                    alert("匯入失敗！請確保格式為：類別,完整句子,錯字,正字,解析,獎勵");
                }
            };

            // JSON Batch Import Handler
            const handleBatchJsonImport = () => {
                try {
                    const parsed = JSON.parse(jsonText);
                    if (Array.isArray(parsed)) {
                        setQuestions([...questions, ...parsed.map((q, idx) => ({ ...q, id: Date.now() + idx }))]);
                        alert(`成功匯入 ${parsed.length} 道 JSON 題目！`);
                        setJsonText("");
                        setActiveTab("list");
                    } else {
                        alert("格式錯誤！需為 JSON 陣列。");
                    }
                } catch (e) {
                    alert("JSON 解析失敗，請檢查格式。");
                }
            };

            const handleExportJSON = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(questions, null, 2));
                const anchor = document.createElement('a');
                anchor.setAttribute("href", dataStr);
                anchor.setAttribute("download", `handwriting_monopoly_bank.json`);
                document.body.appendChild(anchor);
                anchor.click();
                anchor.remove();
            };

            return (
                <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-3 z-50">
                    <div className="bg-slate-900 border border-amber-500/50 rounded-3xl p-5 max-w-2xl w-full h-[85vh] flex flex-col shadow-2xl">
                        
                        <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                            <h3 className="text-base font-black text-amber-400 flex items-center gap-2">
                                <i className="fa-solid fa-user-shield"></i> 教師後台管理中心 (Firebase 即時連線)
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-white">
                                <i className="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        {!isAuthenticated ? (
                            <form onSubmit={handleLoginAdmin} className="my-auto max-w-sm mx-auto w-full p-6 bg-slate-950 rounded-2xl border border-slate-800 text-center">
                                <div className="w-12 h-12 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-2xl mx-auto mb-3">
                                    <i className="fa-solid fa-lock"></i>
                                </div>
                                <h4 className="text-sm font-bold text-white mb-1">請輸入後台管理密碼</h4>
                                <p className="text-[10px] text-slate-400 mb-4">預設密碼為 <code className="text-amber-300 font-bold">source88</code></p>

                                <input
                                    type="password"
                                    required
                                    placeholder="輸入密碼..."
                                    value={passwordInput}
                                    onChange={(e) => setPasswordInput(e.target.value)}
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white text-center mb-3"
                                />

                                {passwordError && (
                                    <div className="text-xs text-rose-400 mb-3 font-bold">密碼不正確，請重新輸入！</div>
                                )}

                                <button
                                    type="submit"
                                    className="w-full py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs transition">
                                    解鎖進入後台
                                </button>
                            </form>
                        ) : (
                            <div className="flex-1 flex flex-col overflow-hidden my-2">
                                
                                {/* Admin Tab Nav */}
                                <div className="flex items-center gap-1.5 mb-3 border-b border-slate-800 pb-2 overflow-x-auto">
                                    <button
                                        onClick={() => setActiveTab('rooms')}
                                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 shrink-0 ${
                                            activeTab === 'rooms' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-400'
                                        }`}>
                                        <i className="fa-solid fa-person-shelter"></i> 房間現場監控
                                    </button>
                                    <button
                                        onClick={() => setActiveTab('excel_io')}
                                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 shrink-0 ${
                                            activeTab === 'excel_io' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-400'
                                        }`}>
                                        <i className="fa-solid fa-file-excel"></i> Excel 匯入/匯出
                                    </button>
                                    <button
                                        onClick={() => setActiveTab('csv_import')}
                                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 shrink-0 ${
                                            activeTab === 'csv_import' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-400'
                                        }`}>
                                        <i className="fa-solid fa-file-csv"></i> CSV 批次匯入
                                    </button>
                                    <button
                                        onClick={() => setActiveTab('json_import')}
                                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 shrink-0 ${
                                            activeTab === 'json_import' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-400'
                                        }`}>
                                        <i className="fa-solid fa-code"></i> JSON 匯入/匯出
                                    </button>
                                    <button
                                        onClick={() => setActiveTab('list')}
                                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 shrink-0 ${
                                            activeTab === 'list' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-400'
                                        }`}>
                                        <i className="fa-solid fa-list"></i> 題庫總覽 ({questions.length})
                                    </button>
                                </div>

                                <div className="flex-1 overflow-y-auto pr-1">
                                    
                                    {/* 1. ROOM MONITOR TAB */}
                                    {activeTab === 'rooms' && (
                                        <div className="space-y-3">
                                            <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs text-slate-300 flex items-center justify-between gap-2">
                                                <div>
                                                    <i className="fa-solid fa-eye text-amber-400 mr-1"></i> 老師可在此即時監控 Firebase 雲端房間，可刪除、清空或強制開局。
                                                </div>
                                                {rooms.length > 0 && (
                                                    <button
                                                        onClick={onClearAllRooms}
                                                        className="px-2.5 py-1 bg-rose-900/80 hover:bg-rose-800 text-rose-200 text-[11px] font-bold rounded-lg border border-rose-700/80 transition shrink-0 flex items-center gap-1">
                                                        <i className="fa-solid fa-broom"></i> 一鍵清空所有房間
                                                    </button>
                                                )}
                                            </div>

                                            <div className="space-y-2">
                                                {rooms.length === 0 ? (
                                                    <div className="text-xs text-slate-500 text-center py-8">目前無線上房間</div>
                                                ) : (
                                                    rooms.map(r => (
                                                        <div key={r.id} className="p-3 rounded-2xl bg-slate-950 border border-slate-800 flex items-center justify-between gap-2">
                                                            <div>
                                                                <div className="flex items-center gap-2">
                                                                    <span className="text-xs font-bold text-white">{r.name}</span>
                                                                    <span className="text-[10px] text-indigo-300 font-mono">({r.members.length}/{r.capacity}人)</span>
                                                                </div>
                                                                <div className="text-[10px] text-slate-400 mt-0.5">
                                                                    成員: {r.members.map(m => m.name).join('、')}
                                                                </div>
                                                            </div>

                                                            <div className="flex items-center gap-2">
                                                                <button
                                                                    onClick={() => {
                                                                        onLaunchGame(r);
                                                                        onClose();
                                                                    }}
                                                                    className="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs rounded-xl shadow">
                                                                    強制開局
                                                                </button>
                                                                <button
                                                                    onClick={() => onDeleteRoom(r.id)}
                                                                    className="px-2.5 py-1.5 bg-rose-600/80 hover:bg-rose-600 text-white font-bold text-xs rounded-xl shadow border border-rose-500/40 transition flex items-center gap-1">
                                                                    <i className="fa-solid fa-trash"></i> 刪除
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ))
                                                )}
                                            </div>
                                        </div>
                                    )}

                                    {/* 2. EXCEL IMPORT / EXPORT TAB */}
                                    {activeTab === 'excel_io' && (
                                        <div className="space-y-4">
                                            <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs text-slate-300">
                                                <p className="font-bold text-emerald-400 mb-1"><i className="fa-solid fa-file-excel mr-1"></i> Excel 檔案格式說明 (.xlsx / .xls)：</p>
                                                <p className="text-[11px] font-mono text-slate-400">第一列可為標題列，直欄順序建議為：</p>
                                                <p className="text-[11px] font-mono text-amber-300 mt-0.5">【A欄】類別 | 【B欄】完整句子 | 【C欄】錯字 | 【D欄】正字 | 【E欄】解析說明 | 【F欄】獎勵金額</p>
                                                <p className="text-[10px] text-slate-500 mt-1">例如：常用錯別字 | 這件事情非同小客。 | 客 | 可 | 正確為非同小可 | 120</p>
                                            </div>

                                            {/* Excel Upload Area */}
                                            <div className="p-4 bg-slate-950 rounded-2xl border-2 border-dashed border-emerald-500/50 text-center">
                                                <i className="fa-solid fa-file-arrow-up text-3xl text-emerald-400 mb-2"></i>
                                                <h4 className="text-xs font-bold text-white mb-1">選擇 Excel 檔案 (.xlsx, .xls) 匯入題庫</h4>
                                                <p className="text-[10px] text-slate-400 mb-3">匯入後會自動批次追加至 Firebase 雲端資料庫</p>
                                                <label className="inline-flex items-center gap-2 px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold rounded-xl cursor-pointer shadow-lg transition">
                                                    <i className="fa-solid fa-folder-open"></i> 瀏覽電腦中 Excel 檔案...
                                                    <input
                                                        type="file"
                                                        accept=".xlsx, .xls"
                                                        onChange={handleExcelFileSelect}
                                                        className="hidden"
                                                    />
                                                </label>
                                            </div>

                                            {/* Excel Download Area */}
                                            <div className="p-4 bg-slate-950 rounded-2xl border border-slate-800 flex items-center justify-between">
                                                <div>
                                                    <div className="text-xs font-bold text-white">備份匯出當前雲端題庫</div>
                                                    <div className="text-[10px] text-slate-400">將目前所有的 {questions.length} 道題目打包下載為 Excel 試算表檔</div>
                                                </div>
                                                <button
                                                    onClick={handleExportExcel}
                                                    disabled={questions.length === 0}
                                                    className="px-4 py-2 bg-purple-600 hover:bg-purple-500 disabled:opacity-40 text-white text-xs font-extrabold rounded-xl shadow-lg transition flex items-center gap-1.5">
                                                    <i className="fa-solid fa-file-arrow-down"></i> 匯出 Excel 檔 (.xlsx)
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {/* 3. CSV BATCH IMPORT */}
                                    {activeTab === 'csv_import' && (
                                        <div className="space-y-3">
                                            <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs text-slate-300">
                                                <p className="font-bold text-amber-300 mb-1">CSV/純文字 批次貼入格式 (每行一道題)：</p>
                                                <p className="text-[11px] font-mono text-slate-400">類別, 完整句子, 錯字, 正字, 解析說明, 獎勵金額</p>
                                                <p className="text-[10px] text-slate-500 mt-1">例如：成語錯別字, 這件事情非同小客。, 客, 可, 正確為非同小可, 120</p>
                                            </div>

                                            <textarea
                                                value={csvText}
                                                onChange={(e) => setCsvText(e.target.value)}
                                                placeholder="請在此貼上多行 CSV 格式題目..."
                                                className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-white h-44 font-mono leading-relaxed"
                                            />

                                            <button
                                                onClick={handleBatchCsvImport}
                                                className="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs rounded-xl shadow-lg transition">
                                                <i className="fa-solid fa-file-import mr-1"></i> 確認批次匯入 CSV 題目至雲端
                                            </button>
                                        </div>
                                    )}

                                    {/* 4. JSON BATCH IMPORT / EXPORT */}
                                    {activeTab === 'json_import' && (
                                        <div className="space-y-3">
                                            <textarea
                                                value={jsonText}
                                                onChange={(e) => setJsonText(e.target.value)}
                                                placeholder="貼上 JSON 題目陣列..."
                                                className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-white h-44 font-mono"
                                            />

                                            <div className="flex gap-2">
                                                <button onClick={handleBatchJsonImport} className="flex-1 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl">
                                                    匯入 JSON 至雲端
                                                </button>
                                                <button onClick={handleExportJSON} className="flex-1 py-2 bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs rounded-xl">
                                                    備份匯出 JSON
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {/* 5. QUESTION LIST VIEW & EDIT MODAL */}
                                    {activeTab === 'list' && (
                                        <div className="space-y-2">
                                            
                                            {/* Edit Question Form Box */}
                                            {editingQuestion && (
                                                <div className="p-3.5 bg-slate-950 rounded-2xl border-2 border-indigo-500/80 mb-3 space-y-2 shadow-xl animate-fade-in">
                                                    <div className="flex items-center justify-between text-xs font-bold text-indigo-300 border-b border-slate-800 pb-1.5">
                                                        <span><i className="fa-solid fa-pen-to-square mr-1"></i> 編輯題目內容</span>
                                                        <button 
                                                            onClick={() => setEditingQuestion(null)}
                                                            className="text-slate-400 hover:text-rose-400 text-xs font-bold px-1.5">
                                                            <i className="fa-solid fa-xmark mr-0.5"></i> 取消
                                                        </button>
                                                    </div>

                                                    <form onSubmit={handleSaveEditQuestion} className="space-y-2.5 text-xs pt-1">
                                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                            <div>
                                                                <label className="text-[10px] font-bold text-slate-400 mb-0.5 block">題目類別</label>
                                                                <select
                                                                    value={editingQuestion.category}
                                                                    onChange={e => setEditingQuestion({...editingQuestion, category: e.target.value})}
                                                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white text-xs focus:outline-none focus:border-indigo-400">
                                                                    <option value="常用錯別字">常用錯別字</option>
                                                                    <option value="成語錯別字">成語錯別字</option>
                                                                    <option value="語文注音辨析">語文注音辨析</option>
                                                                </select>
                                                            </div>
                                                            <div>
                                                                <label className="text-[10px] font-bold text-amber-300 mb-0.5 block">答對獲得獎勵金 ($)</label>
                                                                <input
                                                                    type="number"
                                                                    value={editingQuestion.reward || 120}
                                                                    onChange={e => setEditingQuestion({...editingQuestion, reward: parseInt(e.target.value, 10) || 120})}
                                                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white text-xs focus:outline-none focus:border-amber-400 font-mono"
                                                                />
                                                            </div>
                                                        </div>

                                                        <div>
                                                            <label className="text-[10px] font-bold text-slate-400 mb-0.5 block">完整句子 (含錯別字)</label>
                                                            <input
                                                                type="text"
                                                                required
                                                                value={editingQuestion.sentence}
                                                                onChange={e => setEditingQuestion({...editingQuestion, sentence: e.target.value})}
                                                                className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white text-xs focus:outline-none focus:border-indigo-400"
                                                            />
                                                        </div>

                                                        <div className="grid grid-cols-2 gap-2">
                                                            <div>
                                                                <label className="text-[10px] font-bold text-rose-400 mb-0.5 block">句中錯字 (1字)</label>
                                                                <input
                                                                    type="text"
                                                                    maxLength={1}
                                                                    required
                                                                    value={editingQuestion.wrongChar}
                                                                    onChange={e => setEditingQuestion({...editingQuestion, wrongChar: e.target.value})}
                                                                    className="w-full bg-slate-900 border border-rose-500/50 rounded-xl p-2 text-rose-200 text-xs text-center font-bold focus:outline-none"
                                                                />
                                                            </div>
                                                            <div>
                                                                <label className="text-[10px] font-bold text-emerald-400 mb-0.5 block">應改正字 (1字)</label>
                                                                <input
                                                                    type="text"
                                                                    maxLength={1}
                                                                    required
                                                                    value={editingQuestion.correctChar}
                                                                    onChange={e => setEditingQuestion({...editingQuestion, correctChar: e.target.value})}
                                                                    className="w-full bg-slate-900 border border-emerald-500/50 rounded-xl p-2 text-emerald-200 text-xs text-center font-bold focus:outline-none"
                                                                />
                                                            </div>
                                                        </div>

                                                        <div>
                                                            <label className="text-[10px] font-bold text-slate-400 mb-0.5 block">解析說明</label>
                                                            <input
                                                                type="text"
                                                                value={editingQuestion.explanation || ""}
                                                                onChange={e => setEditingQuestion({...editingQuestion, explanation: e.target.value})}
                                                                className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white text-xs focus:outline-none focus:border-indigo-400"
                                                            />
                                                        </div>

                                                        <div className="flex justify-end gap-2 pt-1">
                                                            <button 
                                                                type="button" 
                                                                onClick={() => setEditingQuestion(null)}
                                                                className="px-3 py-1.5 bg-slate-800 text-slate-300 font-bold text-xs rounded-xl hover:bg-slate-700 transition">
                                                                取消
                                                            </button>
                                                            <button 
                                                                type="submit" 
                                                                className="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-xs rounded-xl shadow-lg transition">
                                                                <i className="fa-solid fa-floppy-disk mr-1"></i> 儲存修改並同步雲端
                                                            </button>
                                                        </div>
                                                    </form>
                                                </div>
                                            )}

                                            {questions.length === 0 ? (
                                                <div className="text-xs text-slate-500 text-center py-8">目前無題目，請使用 Excel、CSV 或 JSON 匯入題目</div>
                                            ) : (
                                                questions.map(q => (
                                                    <div key={q.id} className="p-2.5 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between gap-2 hover:border-slate-700 transition">
                                                        <div className="flex-1 min-w-0">
                                                            <div className="flex items-center gap-1.5 flex-wrap">
                                                                <span className="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 text-[10px] font-bold shrink-0">
                                                                    {q.category}
                                                                </span>
                                                                <span className="text-xs font-semibold text-white truncate">「{q.sentence}」</span>
                                                            </div>
                                                            <div className="text-[10px] text-slate-400 mt-1 flex items-center gap-2">
                                                                <span className="text-rose-400 font-bold">錯字: {q.wrongChar}</span>
                                                                <span className="text-slate-600">➔</span>
                                                                <span className="text-emerald-400 font-bold">正字: {q.correctChar}</span>
                                                                <span className="text-amber-300 font-mono">(${q.reward || 120})</span>
                                                            </div>
                                                        </div>

                                                        <div className="flex items-center gap-1 shrink-0">
                                                            <button 
                                                                onClick={() => setEditingQuestion({ ...q })} 
                                                                className="p-1.5 text-indigo-400 hover:text-indigo-300 hover:bg-indigo-950/60 rounded-lg transition"
                                                                title="修改題目內容">
                                                                <i className="fa-solid fa-pen-to-square text-xs"></i>
                                                            </button>
                                                            <button 
                                                                onClick={() => {
                                                                    if (window.confirm(`確定要刪除「${q.sentence}」嗎？`)) {
                                                                        setQuestions(questions.filter(x => x.id !== q.id));
                                                                    }
                                                                }} 
                                                                className="p-1.5 text-slate-500 hover:text-rose-400 hover:bg-rose-950/60 rounded-lg transition"
                                                                title="刪除題目">
                                                                <i className="fa-solid fa-trash-can text-xs"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    )}

                                </div>
                            </div>
                        )}

                        <div className="pt-2 border-t border-slate-800 text-right">
                            <button onClick={onClose} className="px-4 py-1.5 bg-slate-800 text-slate-300 font-bold text-xs rounded-xl">
                                關閉管理後台
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
