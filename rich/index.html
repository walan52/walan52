        // ==========================================

        const playAudioFx = (type, enabled = true) => {
            if (!enabled) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();

                if (type === 'dice') {
                    const bufferSize = ctx.sampleRate * 0.12;
                    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    const noise = ctx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = 900;
                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0.25, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);
                    noise.start();
                } else if (type === 'step') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(360, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.07);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.07);
                } else if (type === 'correct') {
                    const freqs = [523.25, 659.25, 783.99, 1046.50];
                    freqs.forEach((f, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.07);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.07);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.07 + 0.22);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + i * 0.07);
                        osc.stop(ctx.currentTime + i * 0.07 + 0.22);
                    });
                } else if (type === 'wrong') {
                    const freqs = [260, 200, 160];
                    freqs.forEach((f, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.09);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.09);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.09 + 0.16);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + i * 0.09);
                        osc.stop(ctx.currentTime + i * 0.09 + 0.16);
                    });
                } else if (type === 'stroke') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(420, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(280, ctx.currentTime + 0.04);
                    gain.gain.setValueAtTime(0.04, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.04);
                } else if (type === 'coin') {
                    const freqs = [987.77, 1318.51];
                    freqs.forEach((f, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.08);
                        gain.gain.setValueAtTime(0.18, ctx.currentTime + i * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.18);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + i * 0.08);
                        osc.stop(ctx.currentTime + i * 0.08 + 0.18);
                    });
                } else if (type === 'upgrade') {
                    const freqs = [440, 554.37, 659.25, 880];
                    freqs.forEach((f, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.06);
                        gain.gain.setValueAtTime(0.12, ctx.currentTime + i * 0.06);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.06 + 0.15);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + i * 0.06);
                        osc.stop(ctx.currentTime + i * 0.06 + 0.15);
                    });
                } else if (type === 'fanfare') {
                    if (window.confetti) {
                        window.confetti({ particleCount: 130, spread: 85, origin: { y: 0.6 } });
                    }
                }
            } catch (e) {
                console.error("Audio error:", e);
            }
        };

        // ==========================================
        // 4. HANDWRITING CANVAS COMPONENT
        // ==========================================
        function HandwritingBoard({ onSelectCandidate, correctChar, soundEnabled, isAi, onAiSimulate }) {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [strokes, setStrokes] = useState([]);
            const [currentStroke, setCurrentStroke] = useState(null);
            const [candidates, setCandidates] = useState([]);
            const [isLoading, setIsLoading] = useState(false);
            const [manualInput, setManualInput] = useState("");

            const clearCanvas = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawGrid(ctx, canvas.width, canvas.height);
                setStrokes([]);
                setCandidates([]);
            };

            const undoStroke = () => {
                if (strokes.length === 0) return;
                const newStrokes = strokes.slice(0, -1);
                setStrokes(newStrokes);
                redrawAllStrokes(newStrokes);
                if (newStrokes.length > 0) {
                    recognizeHandwriting(newStrokes);
                } else {
                    setCandidates([]);
                }
            };

            const drawGrid = (ctx, w, h) => {
                ctx.strokeStyle = "rgba(99, 102, 241, 0.2)";
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);

                ctx.beginPath();
                ctx.moveTo(0, 0); ctx.lineTo(w, h);
                ctx.moveTo(w, 0); ctx.lineTo(0, h);
                ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h);
                ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2);
                ctx.stroke();

                ctx.setLineDash([]);
                ctx.strokeStyle = "rgba(99, 102, 241, 0.4)";
                ctx.strokeRect(0, 0, w, h);
            };

            const redrawAllStrokes = (strokeArray) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawGrid(ctx, canvas.width, canvas.height);

                ctx.strokeStyle = "#818cf8";
                ctx.lineWidth = 7;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                strokeArray.forEach(st => {
                    const xs = st[0];
                    const ys = st[1];
                    if (xs.length === 0) return;
                    ctx.beginPath();
                    ctx.moveTo(xs[0], ys[0]);
                    for (let i = 1; i < xs.length; i++) {
                        ctx.lineTo(xs[i], ys[i]);
                    }
                    ctx.stroke();
                });
            };

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                canvas.width = 260;
                canvas.height = 260;
                drawGrid(ctx, 260, 260);
                setStrokes([]);
                setCandidates([]);
            }, []);

            const recognizeHandwriting = async (strokeData) => {
                if (!strokeData || strokeData.length === 0) {
                    setCandidates([]);
                    return;
                }
                setIsLoading(true);

                try {
                    const payload = {
                        options: "enable_homophone_dict",
                        requests: [{
                            writing_guide: { writing_area_width: 260, writing_area_height: 260 },
                            ink: strokeData,
                            language: "zh-Hant"
                        }]
                    };

                    const res = await fetch("https://inputtools.google.com/request?itc=zh-hant-t-i0-und&num=6", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    if (res.ok) {
                        const data = await res.json();
                        if (data[0] === "SUCCESS" && data[1] && data[1][0] && data[1][0][1]) {
                            const parsedCandidates = data[1][0][1];
                            setCandidates(parsedCandidates);
                        } else {
                            fallbackCandidates();
                        }
                    } else {
                        fallbackCandidates();
                    }
                } catch (err) {
                    fallbackCandidates();
                } finally {
                    setIsLoading(false);
                }
            };

            const fallbackCandidates = () => {
                const options = [correctChar, "可", "厲", "部", "掉", "鶩", "成", "諱"].sort(() => 0.5 - Math.random());
                setCandidates(options.slice(0, 5));
            };

            const getCanvasPos = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: Math.round(clientX - rect.left),
                    y: Math.round(clientY - rect.top)
                };
            };

            const startDrawing = (e) => {
                if (isAi) return;
                e.preventDefault();
                const pos = getCanvasPos(e);
                setIsDrawing(true);
                setCurrentStroke([[pos.x], [pos.y]]);

                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');

                ctx.strokeStyle = "#818cf8";
                ctx.lineWidth = 7;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
                playAudioFx('stroke', soundEnabled);
            };

            const drawMove = (e) => {
                if (!isDrawing || isAi) return;
                e.preventDefault();
                const pos = getCanvasPos(e);
                
                setCurrentStroke(prev => {
                    if (!prev) return null;
                    return [[...prev[0], pos.x], [...prev[1], pos.y]];
                });

                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };

            const stopDrawing = (e) => {
                if (!isDrawing || isAi) return;
                setIsDrawing(false);
                if (currentStroke && currentStroke[0].length > 0) {
                    const updated = [...strokes, currentStroke];
                    setStrokes(updated);
                    setCurrentStroke(null);
                    recognizeHandwriting(updated);
                }
            };

            useEffect(() => {
                if (isAi && onAiSimulate) {
                    const timer = setTimeout(() => {
                        onAiSimulate();
                    }, 1500);
                    return () => clearTimeout(timer);
                }
            }, [isAi]);

            return (
                <div className="flex flex-col items-center gap-2.5">
                    
                    {/* Canvas Area */}
                    <div className="relative p-2 bg-slate-950 border-2 border-indigo-500/60 rounded-2xl shadow-xl">
                        <canvas
                            ref={canvasRef}
                            onMouseDown={startDrawing}
                            onMouseMove={drawMove}
                            onMouseUp={stopDrawing}
                            onMouseLeave={stopDrawing}
                            onTouchStart={startDrawing}
                            onTouchMove={drawMove}
                            onTouchEnd={stopDrawing}
                            className="touch-none cursor-crosshair bg-slate-900 rounded-xl block"
                        />

                        {isLoading && (
                            <div className="absolute top-3 right-3 bg-indigo-600/90 text-white text-[10px] px-2 py-0.5 rounded-full flex items-center gap-1 animate-pulse">
                                <i className="fa-solid fa-spinner fa-spin"></i> 辨識中...
                            </div>
                        )}

                        {isAi && (
                            <div className="absolute inset-0 bg-slate-950/80 rounded-xl flex flex-col items-center justify-center text-indigo-300 font-bold text-sm">
                                <i className="fa-solid fa-robot text-3xl mb-2 animate-bounce text-indigo-400"></i>
                                同學 (AI) 正揮毫手寫解答中...
                            </div>
                        )}
                    </div>

                    {/* Canvas Action Controls */}
                    {!isAi && (
                        <div className="flex items-center gap-2 w-full max-w-[260px]">
                            <button
                                onClick={undoStroke}
                                disabled={strokes.length === 0}
                                className="flex-1 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 text-xs font-bold border border-slate-700 transition flex items-center justify-center gap-1">
                                <i className="fa-solid fa-rotate-left"></i> 復原一筆
                            </button>
                            <button
                                onClick={clearCanvas}
                                disabled={strokes.length === 0}
                                className="flex-1 py-1.5 rounded-xl bg-rose-900/60 hover:bg-rose-800 border border-rose-700/60 disabled:opacity-40 text-rose-200 text-xs font-bold transition flex items-center justify-center gap-1">
                                <i className="fa-solid fa-trash"></i> 清空重寫
                            </button>
                        </div>
                    )}

                    {/* Candidates Selector */}
                    <div className="w-full max-w-[300px] bg-slate-950 p-2.5 rounded-2xl border border-indigo-500/40">
                        <div className="text-[10px] font-bold text-indigo-300 uppercase tracking-wider mb-1.5 flex items-center justify-between">
                            <span><i className="fa-solid fa-hand-pointer mr-1"></i> 請點擊辨識字詞送出答案：</span>
                            {candidates.length > 0 && <span className="text-emerald-400">辨識成功</span>}
                        </div>

                        <div className="flex items-center gap-1.5 overflow-x-auto pb-1 min-h-[44px]">
                            {candidates.length === 0 ? (
                                <div className="text-xs text-slate-500 text-center w-full py-2">
                                    {isAi ? "同組同學思考中..." : "✍️ 請先在上方畫布開始手寫正字..."}
                                </div>
                            ) : (
                                candidates.map((char, idx) => (
                                    <button
                                        key={idx}
                                        onClick={() => onSelectCandidate(char)}
                                        className="w-9 h-9 rounded-xl bg-indigo-600/90 hover:bg-indigo-500 text-white font-extrabold text-lg shadow-lg border border-indigo-300/40 transform active:scale-95 transition shrink-0 flex items-center justify-center">
                                        {char}
                                    </button>
                                ))
                            )}
                        </div>

                        {/* Keyboard Input Fallback */}
                        {!isAi && (
                            <div className="mt-2 pt-2 border-t border-slate-800/80 flex items-center gap-1.5">
                                <input
                                    type="text"
                                    maxLength={1}
                                    placeholder="備用打字..."
                                    value={manualInput}
                                    onChange={(e) => setManualInput(e.target.value)}
                                    className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white text-center"
                                />
                                <button
                                    onClick={() => {
                                        if (manualInput.trim()) {
                                            onSelectCandidate(manualInput.trim());
                                            setManualInput("");
                                        }
                                    }}
                                    className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 rounded-lg border border-slate-700">
                                    送出
                                </button>
                            </div>
                        )}
                    </div>

                </div>
            );
        }

        // ==========================================
        // 5. MAIN APP COMPONENT
        // ==========================================
        function App() {
            const [soundEnabled, setSoundEnabled] = useState(true);
            const [studentNickname, setStudentNickname] = useState("");
            const [selectedAvatarIdx, setSelectedAvatarIdx] = useState(0);
            
            // App state: 'LOGIN', 'ROOM_LOBBY', 'WAITING_ROOM', 'GAME', 'GAME_OVER'
            const [appState, setAppState] = useState('LOGIN');

            // Rooms system state - Real-time synced with Firebase
            const [rooms, setRooms] = useState([]);

            const [currentRoom, setCurrentRoom] = useState(null);
            const [newRoomName, setNewRoomName] = useState("");
            const [newRoomCapacity, setNewRoomCapacity] = useState(3);
            const [countdown, setCountdown] = useState(null);

            // Admin Settings
            const [showAdminModal, setShowAdminModal] = useState(false);

            const [questions, setQuestions] = useState(INITIAL_HANDWRITING_QUESTIONS);
            const [board, setBoard] = useState(BOARD_9X9_LAYOUT);
            const [players, setPlayers] = useState([]);
            const [currentPlayerIdx, setCurrentPlayerIdx] = useState(0);

            // Property Levels: { [tileId]: { ownerId: number, level: number } }
            const [propertyState, setPropertyState] = useState({});

            const [phase, setPhase] = useState('IDLE'); // IDLE, ROLLING, MOVING, QUIZ, CHANCE, GAME_OVER
            const [diceValue, setDiceValue] = useState(1);
            const [isRolling, setIsRolling] = useState(false);
            const [logs, setLogs] = useState([]);

            // Modals
            const [activeQuiz, setActiveQuiz] = useState(null);
            const [activeChance, setActiveChance] = useState(null);
            const [quizResult, setQuizResult] = useState(null);

            const currentRoomRef = useRef(currentRoom);
            useEffect(() => { currentRoomRef.current = currentRoom; }, [currentRoom]);

            const appStateRef = useRef(appState);
            useEffect(() => { appStateRef.current = appState; }, [appState]);

            const isStartingRef = useRef(false);

            // Sync Rooms Realtime from Firebase & Handle Sync Game Launch
            useEffect(() => {
                const roomsRef = db.ref('rooms');
                const handleSnapshot = (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const roomList = Object.values(data);
                        setRooms(roomList);

                        const activeRoomId = currentRoomRef.current?.id;
                        if (activeRoomId) {
                            const updatedCurrent = roomList.find(r => r.id === activeRoomId);
                            if (updatedCurrent) {
                                setCurrentRoom(updatedCurrent);

                                // 雲端同步啟動：當房間狀態更新為 PLAYING 時，所有該房間內的成員同步啟動倒數並進入遊戲
                                if (appStateRef.current === 'WAITING_ROOM' && updatedCurrent.status === 'PLAYING' && !isStartingRef.current) {
                                    isStartingRef.current = true;
                                    triggerRoomStartCountdown(updatedCurrent);
                                }
                            } else if (appStateRef.current === 'WAITING_ROOM' || appStateRef.current === 'GAME') {
                                setCurrentRoom(null);
                                if (appStateRef.current === 'WAITING_ROOM') {
                                    setAppState('ROOM_LOBBY');
                                    alert('您所在的房間已被教師或房主解散！');
                                }
                            }
                        }
                    } else {
                        setRooms([]);
                        if (appStateRef.current === 'WAITING_ROOM') {
                            setCurrentRoom(null);
                            setAppState('ROOM_LOBBY');
                            alert('所有線上房間已被解散或清空！');
                        }
                    }
                };

                roomsRef.on('value', handleSnapshot);
                return () => roomsRef.off('value', handleSnapshot);
            }, []);

            // Sync Question Bank Realtime from Firebase
            useEffect(() => {
                const qRef = db.ref('questions');
                qRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data && Array.isArray(data)) {
                        setQuestions(data);
                    } else {
                        setQuestions([]);
                    }
                });
                return () => qRef.off('value');
            }, []);

            const addLog = (msg, type = 'info') => {
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                setLogs(prev => [{ id: Date.now() + Math.random(), time, msg, type }, ...prev.slice(0, 49)]);
            };

            // 1. Student Login -> Go to Room Lobby
            const handleStudentLogin = (e) => {
                e.preventDefault();
                if (!studentNickname.trim()) return;
                setAppState('ROOM_LOBBY');
                playAudioFx('coin', soundEnabled);
            };

            // 2. Student Create Custom Room
            const handleCreateRoom = (e) => {
                e.preventDefault();
                const roomTitle = newRoomName.trim() || `${studentNickname} 的改錯字對戰房`;
                const roomId = `ROOM_${Math.floor(100 + Math.random() * 900)}`;
                const roomObj = {
                    id: roomId,
                    name: roomTitle,
                    capacity: newRoomCapacity,
                    host: studentNickname,
                    status: 'WAITING',
                    members: [
                        { name: studentNickname, avatar: AVATARS[selectedAvatarIdx], isAi: false }
                    ]
                };

                isStartingRef.current = false;
                db.ref(`rooms/${roomId}`).set(roomObj);
                setCurrentRoom(roomObj);
                setAppState('WAITING_ROOM');
                setNewRoomName("");
                playAudioFx('coin', soundEnabled);
            };

            // 3. Student Join Existing Room (雲端同步加入)
            const handleJoinRoom = (targetRoom) => {
                if (targetRoom.members.length >= targetRoom.capacity) {
                    alert("該房間人數已滿！");
                    return;
                }

                const isFull = (targetRoom.members.length + 1) >= targetRoom.capacity;
                const updatedMembers = [
                    ...targetRoom.members,
                    { name: studentNickname, avatar: AVATARS[selectedAvatarIdx], isAi: false }
                ];

                const updatedRoom = { 
                    ...targetRoom, 
                    members: updatedMembers,
                    status: isFull ? 'PLAYING' : (targetRoom.status || 'WAITING')
                };

                isStartingRef.current = false;
                db.ref(`rooms/${targetRoom.id}`).set(updatedRoom);
                setCurrentRoom(updatedRoom);
                setAppState('WAITING_ROOM');
                playAudioFx('coin', soundEnabled);
            };

            // 4. Simulate a classmate joining current room (雲端同步加入)
            const handleSimulateClassmateJoin = () => {
                if (!currentRoom || currentRoom.members.length >= currentRoom.capacity) return;

                const shuffled = [...CLASSMATE_POOL].sort(() => 0.5 - Math.random());
                const isFull = (currentRoom.members.length + 1) >= currentRoom.capacity;
                const newMember = {
                    name: `${shuffled[0]} (同學)`,
                    avatar: AVATARS[(currentRoom.members.length + 1) % AVATARS.length],
                    isAi: true
                };

                const updatedRoom = {
                    ...currentRoom,
                    members: [...currentRoom.members, newMember],
                    status: isFull ? 'PLAYING' : (currentRoom.status || 'WAITING')
                };

                db.ref(`rooms/${currentRoom.id}`).set(updatedRoom);
                setCurrentRoom(updatedRoom);
                playAudioFx('coin', soundEnabled);
            };

            // 5. Fill remaining room slots with AI players and launch immediately (雲端同步開局)
            const handleFillAiAndLaunch = () => {
                if (!currentRoom) return;

                const neededCount = currentRoom.capacity - currentRoom.members.length;
                const shuffled = [...CLASSMATE_POOL].sort(() => 0.5 - Math.random());
                const newMembers = [...currentRoom.members];

                for (let i = 0; i < neededCount; i++) {
                    newMembers.push({
                        name: `${shuffled[i % shuffled.length]} (AI同學)`,
                        avatar: AVATARS[(newMembers.length) % AVATARS.length],
                        isAi: true
                    });
                }

                const updatedRoom = { 
                    ...currentRoom, 
                    members: newMembers,
                    status: 'PLAYING'
                };
                
                db.ref(`rooms/${currentRoom.id}`).set(updatedRoom);
                setCurrentRoom(updatedRoom);
                playAudioFx('fanfare', soundEnabled);
            };

            // 6. Admin Delete Room / Clear All Rooms Handlers
            const handleDeleteRoom = (roomId) => {
                db.ref(`rooms/${roomId}`).remove();
                if (currentRoom && currentRoom.id === roomId) {
                    setCurrentRoom(null);
                    if (appState === 'WAITING_ROOM') {
                        setAppState('ROOM_LOBBY');
                    }
                }
            };

            const handleClearAllRooms = () => {
                if (window.confirm("確定要清空所有線上房間嗎？")) {
                    db.ref('rooms').remove();
                    if (appState === 'WAITING_ROOM') {
                        setCurrentRoom(null);
                        setAppState('ROOM_LOBBY');
                    }
                }
            };

            // Trigger Launch Countdown when full / synced from Firebase
            const triggerRoomStartCountdown = (roomObj) => {
                setCountdown(3);
                playAudioFx('correct', soundEnabled);

                const interval = setInterval(() => {
                    setCountdown(prev => {
                        if (prev <= 1) {
                            clearInterval(interval);
                            launchMonopolyGame(roomObj);
                            return null;
                        }
                        return prev - 1;
                    });
                }, 1000);
            };

            // Launch Monopoly Game Engine
            const launchMonopolyGame = (roomObj) => {
                const newPlayers = roomObj.members.map((m, idx) => ({
                    id: idx,
                    name: m.name,
                    isAi: m.isAi,
                    avatar: m.avatar,
                    coins: 1200,
                    position: 0,
                    skipTurns: 0,
                    items: { hint: 1 },
                    stats: { correct: 0, total: 0 }
                }));

                setPlayers(newPlayers);
                setPropertyState({});
                setCurrentPlayerIdx(0);
                setPhase('IDLE');
                setAppState('GAME');
                setCountdown(null);
                addLog(`【${roomObj.name}】成員集結完成！成員：${roomObj.members.map(m => m.name).join('、')}。`, 'system');
                addLog(`9x9 手寫改錯字大富翁遊戲開局！由 ${newPlayers[0].name} 先攻。`, 'action');
                playAudioFx('fanfare', soundEnabled);
            };

            const rollDice = () => {
                if (phase !== 'IDLE' || isRolling) return;

                const currPlayer = players[currentPlayerIdx];
                if (currPlayer.skipTurns > 0) {
                    addLog(`${currPlayer.name} 處於禁言休息狀態，暫停乙輪！`, 'warning');
                    setPlayers(prev => prev.map((p, idx) => idx === currentPlayerIdx ? { ...p, skipTurns: p.skipTurns - 1 } : p));
                    nextTurn();
                    return;
                }

                setIsRolling(true);
                setPhase('ROLLING');
                playAudioFx('dice', soundEnabled);

                let rollCount = 0;
                const interval = setInterval(() => {
                    const tempVal = Math.floor(Math.random() * 6) + 1;
                    setDiceValue(tempVal);
                    rollCount++;
                    if (rollCount > 10) {
                        clearInterval(interval);
                        const finalVal = Math.floor(Math.random() * 6) + 1;
                        setDiceValue(finalVal);
                        setIsRolling(false);
                        addLog(`${currPlayer.name} 擲出了 ${finalVal} 點！`, 'action');
                        movePlayerSteps(currPlayer.id, finalVal);
                    }
                }, 50);
            };

            const movePlayerSteps = (playerId, steps) => {
                setPhase('MOVING');
                let stepRemaining = steps;

                const stepInterval = setInterval(() => {
                    setPlayers(prev => prev.map(p => {
                        if (p.id === playerId) {
                            const nextPos = (p.position + 1) % board.length;
                            let newCoins = p.coins;
                            if (nextPos === 0) {
                                newCoins += 200;
                                addLog(`${p.name} 順利繞行棋盤起點，領取津貼 $200！`, 'success');
                                playAudioFx('coin', soundEnabled);
                            }
                            return { ...p, position: nextPos, coins: newCoins };
                        }
                        return p;
                    }));

                    playAudioFx('step', soundEnabled);
                    stepRemaining--;

                    if (stepRemaining <= 0) {
                        clearInterval(stepInterval);
                        setTimeout(() => {
                            handleTileLanding(playerId);
                        }, 280);
                    }
                }, 200);
            };

            const handleTileLanding = (playerId) => {
                const player = players.find(p => p.id === playerId);
                const tile = board[player.position];

                addLog(`${player.name} 踏上了【${tile.name}】`, 'info');

                if (tile.type === 'GO') {
                    playAudioFx('coin', soundEnabled);
                    nextTurn();
                } else if (tile.type === 'BONUS') {
                    setPlayers(prev => prev.map(p => p.id === playerId ? { ...p, coins: p.coins + tile.bonus } : p));
                    addLog(`${player.name} 獲得獎勵金 $${tile.bonus}！`, 'success');
                    playAudioFx('coin', soundEnabled);
                    nextTurn();
                } else if (tile.type === 'JAIL') {
                    setPlayers(prev => prev.map(p => p.id === playerId ? { ...p, skipTurns: 1 } : p));
                    addLog(`${player.name} 進入禁言區，下一輪暫停處罰！`, 'warning');
                    nextTurn();
                } else if (tile.type === 'CLINIC') {
                    setPlayers(prev => prev.map(p => p.id === playerId ? { ...p, coins: Math.max(0, p.coins - 80) } : p));
                    addLog(`${player.name} 支付文字健檢費 $80。`, 'danger');
                    nextTurn();
                } else if (tile.type === 'TAX') {
                    setPlayers(prev => prev.map(p => p.id === playerId ? { ...p, coins: Math.max(0, p.coins - tile.tax) } : p));
                    addLog(`${player.name} 繳納典籍維護稅款 $${tile.tax}。`, 'danger');
                    nextTurn();
                } else if (tile.type === 'PARK') {
                    addLog(`${player.name} 悠閒品茶休養生息。`, 'info');
                    nextTurn();
                } else if (tile.type === 'CHANCE' || tile.type === 'FATE') {
                    triggerChanceOrFate(player, tile.type);
                } else if (tile.type === 'TREASURE') {
                    const coinBonus = 150;
                    setPlayers(prev => prev.map(p => p.id === playerId ? { 
                        ...p, 
                        coins: p.coins + coinBonus,
                        items: { ...p.items, hint: p.items.hint + 1 }
                    } : p));
                    addLog(`${player.name} 開啟幸運寶箱！獲得 $${coinBonus} 及 1 張提示卡！`, 'success');
                    playAudioFx('coin', soundEnabled);
                    nextTurn();
                } else if (tile.type === 'PROPERTY') {
                    triggerQuizChallenge(player, tile);
                }
            };

            const triggerChanceOrFate = (player, cardType) => {
                const events = [
                    { title: "書法特優獲獎", text: "手寫筆跡端正獲選國學佳作，獲頒獎金 $200", effect: p => ({ ...p, coins: p.coins + 200 }) },
                    { title: "出版改錯手冊", text: "編纂《繁體錯別字辭典》大賣，獲版稅收入 $160", effect: p => ({ ...p, coins: p.coins + 160 }) },
                    { title: "公文錯字罰款", text: "手寫公文出現繁體錯字，罰扣研習費 $90", effect: p => ({ ...p, coins: Math.max(0, p.coins - 90) }) },
                    { title: "名師親自指點", text: "獲得國學大師贈與 1 張解答提示卡！", effect: p => ({ ...p, items: { ...p.items, hint: p.items.hint + 1 } }) }
                ];
                const evt = events[Math.floor(Math.random() * events.length)];
                setActiveChance({ player, event: evt, type: cardType });
                setPhase('CHANCE');
                setPlayers(prev => prev.map(p => p.id === player.id ? evt.effect(p) : p));
                addLog(`【${cardType}】${player.name}：${evt.title}（${evt.text}）`, 'action');
            };

            const triggerQuizChallenge = (player, tile) => {
                const categoryQuestions = questions.filter(q => q.category === tile.category);
                const pool = categoryQuestions.length > 0 ? categoryQuestions : questions;

                if (!pool || pool.length === 0) {
                    addLog(`【${tile.name}】目前題庫尚無可用題目，請至教師後台匯入題目！`, 'warning');
                    nextTurn();
                    return;
                }

                const randomQ = pool[Math.floor(Math.random() * pool.length)];

                const currentProp = propertyState[tile.id] || null;
                const owner = currentProp ? players.find(p => p.id === currentProp.ownerId) : null;

                setActiveQuiz({
                    tile,
                    question: randomQ,
                    propData: currentProp,
                    owner
                });
                setQuizResult(null);
                setPhase('QUIZ');
            };

            useEffect(() => {
                if (appState === 'GAME' && phase === 'IDLE' && players[currentPlayerIdx]?.isAi) {
                    const timer = setTimeout(() => rollDice(), 1000);
                    return () => clearTimeout(timer);
                }
            }, [appState, phase, currentPlayerIdx]);

            const calculateRent = (baseRent, level = 1) => {
                if (level === 2) return Math.round(baseRent * 1.8);
                if (level === 3) return Math.round(baseRent * 2.8);
                return baseRent;
            };

            const handleHandwritingSubmit = (writtenChar) => {
                if (quizResult !== null) return;

                const currPlayer = players[currentPlayerIdx];
                const isCorrect = writtenChar === activeQuiz.question.correctChar;

                setPlayers(prev => prev.map(p => p.id === currPlayer.id ? {
                    ...p,
                    stats: {
                        correct: p.stats.correct + (isCorrect ? 1 : 0),
                        total: p.stats.total + 1
                    }
                } : p));

                if (isCorrect) {
                    playAudioFx('correct', soundEnabled);
                    const rewardMoney = activeQuiz.question.reward || 120;
                    let extraMsg = "";

                    if (!activeQuiz.owner) {
                        extraMsg = `手寫正確！獲得研習獎賞 $${rewardMoney}！`;
                    } else if (activeQuiz.owner.id === currPlayer.id) {
                        extraMsg = `手寫答對！過關獲得獎勵 $${rewardMoney}！`;
                    } else {
                        extraMsg = `手寫正字成功！豁免過路費，並獲得獎賞 $${rewardMoney}！`;
                    }

                    setQuizResult({
                        correct: true,
                        writtenChar,
                        message: `手寫正字【${writtenChar}】正確！ ${extraMsg}`,
                        explanation: activeQuiz.question.explanation
                    });

                    setPlayers(prev => prev.map(p => p.id === currPlayer.id ? { ...p, coins: p.coins + rewardMoney } : p));
                    addLog(`${currPlayer.name} 手寫正字【${writtenChar}】過關！${extraMsg}`, 'success');

                } else {
                    playAudioFx('wrong', soundEnabled);
                    let fineMsg = "";
                    const currentLevel = activeQuiz.propData?.level || 1;
                    const calculatedRent = calculateRent(activeQuiz.tile.rent, currentLevel);

                    if (activeQuiz.owner && activeQuiz.owner.id !== currPlayer.id) {
                        fineMsg = `手寫【${writtenChar}】錯誤 (正字為「${activeQuiz.question.correctChar}」)！支付過路費 $${calculatedRent} 給 ${activeQuiz.owner.name}。`;
                        setPlayers(prev => prev.map(p => {
                            if (p.id === currPlayer.id) return { ...p, coins: Math.max(0, p.coins - calculatedRent) };
                            if (p.id === activeQuiz.owner.id) return { ...p, coins: p.coins + calculatedRent };
                            return p;
                        }));
                    } else {
                        const penalty = 50;
                        fineMsg = `手寫【${writtenChar}】錯誤 (正字為「${activeQuiz.question.correctChar}」)！扣除研習罰金 $${penalty}。`;
                        setPlayers(prev => prev.map(p => p.id === currPlayer.id ? { ...p, coins: Math.max(0, p.coins - penalty) } : p));
                    }

                    setQuizResult({
                        correct: false,
                        writtenChar,
                        message: fineMsg,
                        explanation: activeQuiz.question.explanation
                    });
                    addLog(`${currPlayer.name} 手寫解答不正確。${fineMsg}`, 'danger');
                }
            };

            const handleAiSimulateHandwriting = () => {
                if (!activeQuiz) return;
                const isCorrect = Math.random() < 0.80;
                let choice = activeQuiz.question.correctChar;
                if (!isCorrect) {
                    choice = activeQuiz.question.wrongChar;
                }
                handleHandwritingSubmit(choice);
            };

            const handleBuyProperty = () => {
                const currPlayer = players[currentPlayerIdx];
                const tile = activeQuiz.tile;

                if (currPlayer.coins < tile.price) return;

                setPropertyState(prev => ({
                    ...prev,
                    [tile.id]: { ownerId: currPlayer.id, level: 1 }
                }));

                setPlayers(prev => prev.map(p => p.id === currPlayer.id ? {
                    ...p,
                    coins: p.coins - tile.price
                } : p));

                addLog(`${currPlayer.name} 花費 $${tile.price} 購入地產【${tile.name}】(LV1)！`, 'success');
                playAudioFx('coin', soundEnabled);
                closeQuizModal();
            };

            const handleUpgradeProperty = () => {
                const currPlayer = players[currentPlayerIdx];
                const tile = activeQuiz.tile;
                const currentLevel = activeQuiz.propData?.level || 1;
                if (currentLevel >= 3) return;

                const upgradeCost = Math.round(tile.price * 0.6);
                if (currPlayer.coins < upgradeCost) return;

                setPropertyState(prev => ({
                    ...prev,
                    [tile.id]: { ownerId: currPlayer.id, level: currentLevel + 1 }
                }));

                setPlayers(prev => prev.map(p => p.id === currPlayer.id ? {
                    ...p,
                    coins: p.coins - upgradeCost
                } : p));

                addLog(`${currPlayer.name} 花費 $${upgradeCost} 升級【${tile.name}】至 LV${currentLevel + 1}！`, 'success');
                playAudioFx('upgrade', soundEnabled);
                closeQuizModal();
            };

            const closeQuizModal = () => {
                setActiveQuiz(null);
                setQuizResult(null);
                nextTurn();
            };

            const nextTurn = () => {
                const alive = players.filter(p => p.coins > 0);

                if (alive.length <= 1 && players.length > 1) {
                    setAppState('GAME_OVER');
                    playAudioFx('fanfare', soundEnabled);
                    addLog(`遊戲結束！誕生最終大富翁！`, 'success');
                    return;
                }
                setCurrentPlayerIdx((currentPlayerIdx + 1) % players.length);
                setPhase('IDLE');
            };

            const resetToLogin = () => {
                isStartingRef.current = false;
                setAppState('LOGIN');
                setPhase('IDLE');
                setPlayers([]);
                setPropertyState({});
                setLogs([]);
                setCurrentRoom(null);
            };

            const updateQuestionsBank = (newQuestions) => {
                setQuestions(newQuestions);
                db.ref('questions').set(newQuestions);
            };

            return (
                <div className="max-w-7xl mx-auto flex flex-col min-h-screen">
                    
                    {/* Header Bar */}
                    <header className="bg-slate-900/80 backdrop-blur border border-slate-700/60 rounded-2xl p-2 sm:p-3 mb-2 flex flex-wrap items-center justify-between gap-2 shadow-xl">
                        <div className="flex items-center gap-2.5">
                            <div className="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white text-base sm:text-lg font-black shadow-lg">
                                <i className="fa-solid fa-pen-nib"></i>
                            </div>
                            <div>
                                <h1 className="text-base sm:text-xl font-extrabold bg-gradient-to-r from-indigo-300 via-purple-300 to-amber-300 bg-clip-text text-transparent">
                                    手寫改錯字大富翁 <span className="text-xs text-indigo-400 font-mono">(Firebase 雲端連線版)</span>
                                </h1>
                                <p className="text-[10px] sm:text-xs text-slate-400">9x9 Chinese Monopoly with Firebase Realtime Lobby & AI Battle</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            <button
                                onClick={() => setShowAdminModal(true)}
                                className="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs flex items-center gap-1.5 transition shadow-lg glow-gold">
                                <i className="fa-solid fa-key"></i> 教師管理後台
                            </button>
                            <button
                                onClick={() => setSoundEnabled(!soundEnabled)}
                                className={`px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition border ${
                                    soundEnabled ? 'bg-emerald-600/80 border-emerald-400/30 text-white' : 'bg-slate-700 border-slate-600 text-slate-400'
                                }`}>
                                <i className={`fa-solid ${soundEnabled ? 'fa-volume-high' : 'fa-volume-xmark'}`}></i> 音效
                            </button>
                            {appState !== 'LOGIN' && (
                                <button
                                    onClick={resetToLogin}
                                    className="px-2.5 py-1.5 rounded-lg bg-rose-600/80 hover:bg-rose-600 text-white text-xs font-semibold flex items-center gap-1 transition border border-rose-400/30">
                                    <i className="fa-solid fa-arrow-right-from-bracket"></i> 登出/大廳
                                </button>
                            )}
                        </div>
                    </header>

                    {/* 1. STUDENT LOGIN SCREEN */}
                    {appState === 'LOGIN' && (
                        <div className="flex-1 flex items-center justify-center p-3">
                            <div className="bg-slate-900/90 border border-slate-700 rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl backdrop-blur-md">
                                <div className="text-center mb-6">
                                    <div className="inline-block p-3.5 rounded-2xl bg-indigo-500/10 text-indigo-400 text-4xl mb-3 border border-indigo-500/20">
                                        <i className="fa-solid fa-graduation-cap"></i>
                                    </div>
                                    <h2 className="text-2xl font-black text-white">學生登入大廳</h2>
                                    <p className="text-xs text-slate-400 mt-1">請輸入姓名暱稱，進入大廳自訂創建房間或加入同學的對戰房</p>
                                </div>

                                <form onSubmit={handleStudentLogin} className="space-y-5">
                                    <div>
                                        <label className="block text-xs font-bold text-indigo-300 uppercase mb-1.5">
                                            <i className="fa-solid fa-user mr-1"></i> 請輸入學生暱稱/姓名
                                        </label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="例如：王小明..."
                                            value={studentNickname}
                                            onChange={(e) => setStudentNickname(e.target.value)}
                                            className="w-full bg-slate-950 border-2 border-indigo-500/50 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-400 transition"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-indigo-300 uppercase mb-2">
                                            <i className="fa-solid fa-icons mr-1"></i> 選擇個人角色頭像
                                        </label>
                                        <div className="grid grid-cols-5 gap-1.5">
                                            {AVATARS.map((av, idx) => (
                                                <button
                                                    type="button"
                                                    key={idx}
                                                    onClick={() => setSelectedAvatarIdx(idx)}
                                                    className={`p-2 rounded-xl border flex flex-col items-center gap-1 transition ${
                                                        selectedAvatarIdx === idx 
                                                            ? `${av.color} border-white shadow-lg scale-105` 
                                                            : 'bg-slate-800 border-slate-700 text-slate-400'
                                                    }`}>
                                                    <i className={`fa-solid ${av.icon} text-lg text-white`}></i>
                                                    <span className="text-[9px] font-bold text-white truncate w-full text-center">{av.name}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <button
                                        type="submit"
                                        className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 hover:from-indigo-600 hover:to-pink-600 text-white font-extrabold text-sm shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2">
                                        <i className="fa-solid fa-door-open"></i> 進入雲端對戰房間大廳
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 2. ROOM LOBBY SCREEN */}
                    {appState === 'ROOM_LOBBY' && (
                        <div className="flex-1 grid grid-cols-1 md:grid-cols-12 gap-3 p-1">
                            
                            {/* Create Room Panel */}
                            <div className="md:col-span-5 bg-slate-900/90 border border-slate-700 rounded-3xl p-5 shadow-2xl flex flex-col justify-between">
                                <div>
                                    <div className="flex items-center gap-2 mb-4">
                                        <div className="w-10 h-10 rounded-2xl bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center text-xl">
                                            <i className="fa-solid fa-plus"></i>
                                        </div>
                                        <div>
                                            <h3 className="text-base font-black text-white">創建自訂對戰房間</h3>
                                            <p className="text-[10px] text-slate-400">設定房間名稱與對戰人數，發起大富翁對局</p>
                                        </div>
                                    </div>

                                    <form onSubmit={handleCreateRoom} className="space-y-4">
                                        <div>
                                            <label className="block text-xs font-bold text-indigo-300 mb-1">房間名稱</label>
                                            <input
                                                type="text"
                                                placeholder={`${studentNickname} 的對戰房`}
                                                value={newRoomName}
                                                onChange={(e) => setNewRoomName(e.target.value)}
                                                className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-400"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-indigo-300 mb-1">對戰總人數上限</label>
                                            <div className="grid grid-cols-4 gap-2">
                                                {[2, 3, 4, 5].map(n => (
                                                    <button
                                                        type="button"
                                                        key={n}
                                                        onClick={() => setNewRoomCapacity(n)}
                                                        className={`py-2 rounded-xl font-bold text-xs border transition ${
                                                            newRoomCapacity === n
                                                                ? 'bg-indigo-600 border-indigo-400 text-white shadow-lg'
                                                                : 'bg-slate-950 border-slate-800 text-slate-400'
                                                        }`}>
                                                        {n} 人房
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <button
                                            type="submit"
                                            className="w-full py-3 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-extrabold text-xs shadow-xl transition flex items-center justify-center gap-2">
                                            <i className="fa-solid fa-house-medical"></i> 立即創建房間
                                        </button>
                                    </form>
                                </div>

                                <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800/80 mt-4">
                                    <div className="text-[10px] text-slate-400 flex items-center gap-2">
                                        <div className={`w-6 h-6 rounded-lg ${AVATARS[selectedAvatarIdx].color} flex items-center justify-center text-white text-[10px]`}>
                                            <i className={`fa-solid ${AVATARS[selectedAvatarIdx].icon}`}></i>
                                        </div>
                                        <span>目前身分：<strong className="text-white">{studentNickname}</strong></span>
                                    </div>
                                </div>
                            </div>

                            {/* Active Rooms List */}
                            <div className="md:col-span-7 bg-slate-900/90 border border-slate-700 rounded-3xl p-5 shadow-2xl flex flex-col">
                                <div className="flex items-center justify-between pb-3 border-b border-slate-800 mb-3">
                                    <h3 className="text-sm font-black text-white flex items-center gap-2">
                                        <i className="fa-solid fa-list-check text-amber-400"></i> 線上開放房間大廳
                                    </h3>
                                    <span className="text-[10px] font-mono text-indigo-400">{rooms.length} 個進行中房間</span>
                                </div>

                                <div className="flex-1 overflow-y-auto space-y-2.5 pr-1 max-h-[380px]">
                                    {rooms.length === 0 ? (
                                        <div className="text-xs text-slate-500 text-center py-12 bg-slate-950/60 rounded-2xl border border-dashed border-slate-800">
                                            目前無開放房間，歡迎左側創建第一間對戰房！
                                        </div>
                                    ) : (
                                        rooms.map(room => {
                                            const isFull = room.members.length >= room.capacity;
                                            return (
                                                <div key={room.id} className="p-3.5 rounded-2xl bg-slate-950 border border-slate-800 flex items-center justify-between hover:border-indigo-500/50 transition">
                                                    <div>
                                                        <div className="flex items-center gap-2">
                                                            <span className="text-xs font-black text-white">{room.name}</span>
                                                            <span className="text-[9px] font-mono px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">
                                                                {room.id}
                                                            </span>
                                                        </div>
                                                        <div className="text-[10px] text-slate-400 mt-1 flex items-center gap-2">
                                                            <span>房主：<strong className="text-indigo-300">{room.host}</strong></span>
                                                            <span>已加入：{room.members.map(m => m.name).join('、')}</span>
                                                        </div>
                                                    </div>

                                                    <div className="flex items-center gap-3">
                                                        <div className="text-right">
                                                            <div className={`text-xs font-black font-mono ${isFull ? 'text-rose-400' : 'text-emerald-400'}`}>
                                                                {room.members.length} / {room.capacity} 人
                                                            </div>
                                                            <div className="text-[8px] text-slate-500">{isFull ? '已滿員' : '開放中'}</div>
                                                        </div>

                                                        <button
                                                            onClick={() => handleJoinRoom(room)}
                                                            disabled={isFull}
                                                            className={`px-3 py-1.5 rounded-xl font-extrabold text-xs transition ${
                                                                isFull
                                                                    ? 'bg-slate-800 text-slate-600 border border-slate-700 cursor-not-allowed'
                                                                    : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-md'
                                                            }`}>
                                                            {isFull ? '滿員' : '加入房間'}
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>
                            </div>

                        </div>
                    )}

                    {/* 3. ROOM WAITING LOBBY (Auto-Start & AI Battle Option) */}
                    {appState === 'WAITING_ROOM' && currentRoom && (
                        <div className="flex-1 flex items-center justify-center p-3">
                            <div className="bg-slate-900/90 border border-indigo-500/50 rounded-3xl p-6 sm:p-8 max-w-lg w-full text-center shadow-2xl backdrop-blur-md relative overflow-hidden">
                                
                                {countdown !== null && (
                                    <div className="absolute inset-0 bg-slate-950/95 z-30 flex flex-col items-center justify-center animate-fade-in">
                                        <div className="text-6xl font-black text-amber-400 animate-bounce mb-2">{countdown}</div>
                                        <div className="text-sm font-extrabold text-white">人數已滿員！遊戲即將啟動...</div>
                                    </div>
                                )}

                                <div className="p-4 rounded-2xl bg-indigo-500/10 border border-indigo-500/30 mb-5 pulse-glow">
                                    <div className="flex items-center justify-between mb-2">
                                        <span className="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 text-[10px] font-bold border border-indigo-400/30">
                                            {currentRoom.id}
                                        </span>
                                        <span className="text-xs font-black text-emerald-400 font-mono">
                                            {currentRoom.members.length} / {currentRoom.capacity} 人滿員自動啟動
                                        </span>
                                    </div>
                                    <h2 className="text-xl font-black text-white">{currentRoom.name}</h2>
                                    <p className="text-xs text-indigo-300 font-medium mt-1">
                                        等待同學加入中，滿員將自動開局，或可直接選擇 AI 對戰！
                                    </p>
                                </div>

                                {/* Room Members List */}
                                <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-left mb-5 space-y-2">
                                    <div className="text-xs font-bold text-slate-400 uppercase border-b border-slate-800 pb-2 flex items-center justify-between">
                                        <span>已加入房間成員 ({currentRoom.members.length})</span>
                                        <span className="text-[10px] text-amber-300 font-normal">房主: {currentRoom.host}</span>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1 max-h-[180px] overflow-y-auto">
                                        {currentRoom.members.map((m, idx) => (
                                            <div key={idx} className="flex items-center gap-2.5 p-2 rounded-xl bg-slate-900 border border-slate-800">
                                                <div className={`w-8 h-8 rounded-lg ${m.avatar.color} flex items-center justify-center text-white text-xs`}>
                                                    <i className={`fa-solid ${m.avatar.icon}`}></i>
                                                </div>
                                                <div>
                                                    <div className="text-xs font-bold text-white flex items-center gap-1">
                                                        {m.name}
                                                        {m.isAi && <span className="px-1 bg-purple-500/30 text-purple-300 text-[8px] rounded">AI</span>}
                                                    </div>
                                                    <div className="text-[9px] text-emerald-400">已就緒</div>
                                                </div>
                                            </div>
                                        ))}

                                        {/* Empty Waiting Slots */}
                                        {Array.from({ length: currentRoom.capacity - currentRoom.members.length }).map((_, idx) => (
                                            <div key={idx} className="flex items-center gap-2.5 p-2 rounded-xl bg-slate-950 border border-dashed border-slate-800 text-slate-600">
                                                <div className="w-8 h-8 rounded-lg bg-slate-900 flex items-center justify-center text-xs">
                                                    <i className="fa-solid fa-user-plus"></i>
                                                </div>
                                                <span className="text-xs font-medium">等待同學加入...</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Actions */}
                                <div className="space-y-2">
                                    <button
                                        onClick={handleFillAiAndLaunch}
                                        className="w-full py-3 rounded-2xl bg-gradient-to-r from-purple-600 via-indigo-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-extrabold text-xs shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2 glow-box">
                                        <i className="fa-solid fa-robot text-sm"></i> 🤖 選擇 AI 對戰（補滿人數即刻開局）
                                    </button>

                                    <div className="flex gap-2">
                                        <button
                                            onClick={handleSimulateClassmateJoin}
                                            disabled={currentRoom.members.length >= currentRoom.capacity}
                                            className="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 font-bold text-xs transition border border-slate-700 flex items-center justify-center gap-1">
                                            <i className="fa-solid fa-user-check"></i> 模擬同學加入
                                        </button>

                                        <button
                                            onClick={() => {
                                                if (currentRoom) {
                                                    const newMembers = currentRoom.members.filter(m => m.name !== studentNickname);
                                                    if (newMembers.length === 0) {
                                                        db.ref(`rooms/${currentRoom.id}`).remove();
                                                    } else {
                                                        db.ref(`rooms/${currentRoom.id}`).set({ ...currentRoom, members: newMembers });
                                                    }
                                                }
                                                setAppState('ROOM_LOBBY');
                                            }}
                                            className="flex-1 py-2.5 rounded-xl bg-rose-900/60 hover:bg-rose-800 text-rose-200 font-bold text-xs transition border border-rose-700/60">
                                            退出房間
                                        </button>
                                    </div>
                                </div>

                            </div>
                        </div>
                    )}

                    {/* 4. GAME INTERFACE */}
                    {appState === 'GAME' && (
                        <div className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-2 items-start">
                            
                            {/* 9x9 BOARD GRID */}
                            <div className="lg:col-span-8 bg-slate-900/80 border border-slate-800 rounded-2xl p-1.5 sm:p-2 shadow-2xl relative overflow-hidden">
                                <div className="grid grid-cols-9 grid-rows-9 gap-0.5 sm:gap-1 aspect-square max-w-[680px] mx-auto">
                                    
                                    {board.map((tile) => {
                                        const [r, c] = tile.gridPos;
                                        const tilePlayers = players.filter(p => p.position === tile.id);
                                        const propInfo = propertyState[tile.id];
                                        const owner = propInfo ? players.find(p => p.id === propInfo.ownerId) : null;

                                        return (
                                            <div
                                                key={tile.id}
                                                style={{ gridRowStart: r + 1, gridColumnStart: c + 1 }}
                                                className={`relative rounded-lg sm:rounded-xl border flex flex-col justify-between p-0.5 sm:p-1 transition-all overflow-hidden ${
                                                    owner ? 'border-amber-400/90 shadow-md' : 'border-slate-700/60'
                                                } bg-slate-800/90`}>
                                                
                                                <div className={`h-1 w-full rounded-full ${tile.color} opacity-90`}></div>

                                                {owner && (
                                                    <div className={`absolute top-0 right-0 w-2.5 h-2.5 rounded-bl ${owner.avatar.color} flex items-center justify-center text-[7px] text-white font-bold`} title={`所有者: ${owner.name}`}>
                                                        {propInfo.level}
                                                    </div>
                                                )}

                                                <div className="flex-1 flex flex-col justify-between my-0.5">
                                                    <div className="flex items-center gap-0.5 overflow-hidden">
                                                        <i className={`fa-solid ${tile.icon} text-[8px] sm:text-[10px] text-slate-300 shrink-0`}></i>
                                                        <span className="text-[7px] sm:text-[9px] font-bold leading-tight truncate text-slate-200">{tile.name}</span>
                                                    </div>

                                                    {tile.type === 'PROPERTY' && (
                                                        <div className="text-[7px] sm:text-[9px] text-amber-300 font-semibold flex items-center justify-between">
                                                            <span>${tile.price}</span>
                                                            {propInfo && <span className="text-[7px] text-indigo-300 font-mono">LV{propInfo.level}</span>}
                                                        </div>
                                                    )}
                                                </div>

                                                <div className="flex items-center gap-0.5 flex-wrap min-h-[12px]">
                                                    {tilePlayers.map(p => (
                                                        <div
                                                            key={p.id}
                                                            className={`w-3.5 h-3.5 rounded-full ${p.avatar.color} border border-white flex items-center justify-center text-[7px] text-white shadow token-anim`}
                                                            title={p.name}>
                                                            <i className={`fa-solid ${p.avatar.icon}`}></i>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        );
                                    })}

                                    {/* Center Dashboard (Spans cols 2..8, rows 2..8) */}
                                    <div 
                                        style={{ gridColumn: '2 / 9', gridRow: '2 / 9' }}
                                        className="bg-slate-950/90 border border-slate-800 rounded-2xl p-2 sm:p-4 flex flex-col justify-between shadow-inner z-10 my-0.5 mx-0.5">
                                        
                                        <div className="flex items-center justify-between border-b border-slate-800/80 pb-2">
                                            <div className="flex items-center gap-2">
                                                <div className={`w-7 h-7 rounded-lg ${players[currentPlayerIdx]?.avatar.color} flex items-center justify-center text-white text-xs shadow`}>
                                                    <i className={`fa-solid ${players[currentPlayerIdx]?.avatar.icon}`}></i>
                                                </div>
                                                <div>
                                                    <div className="text-[9px] text-slate-400 font-semibold uppercase">當前玩家回合</div>
                                                    <div className="text-xs font-extrabold text-white flex items-center gap-1">
                                                        {players[currentPlayerIdx]?.name}
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="text-right">
                                                <div className="text-[9px] text-slate-400 font-semibold uppercase">資產餘額</div>
                                                <div className="text-sm font-black text-amber-400">
                                                    ${players[currentPlayerIdx]?.coins}
                                                </div>
                                            </div>
                                        </div>

                                        <div className="my-auto text-center flex flex-col items-center justify-center py-2">

                                            <div className="relative mb-2">
                                                <div className={`w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-gradient-to-br from-indigo-600 to-purple-700 border-2 border-indigo-400 flex items-center justify-center text-2xl sm:text-3xl font-black text-white shadow-2xl ${isRolling ? 'dice-rolling' : ''}`}>
