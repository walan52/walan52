<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>安靜！別吵醒睡覺的可愛浣熊 🦝💤</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts for cute typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Zen Maru Gothic', 'Fredoka', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Floating Zzz animations */
    @keyframes floatZzz1 {
      0% { opacity: 0; transform: translate(0, 0) scale(0.6) rotate(-5deg); }
      30% { opacity: 0.9; }
      100% { opacity: 0; transform: translate(28px, -75px) scale(1.3) rotate(10deg); }
    }
    @keyframes floatZzz2 {
      0% { opacity: 0; transform: translate(0, 0) scale(0.5) rotate(5deg); }
      30% { opacity: 0.85; }
      100% { opacity: 0; transform: translate(40px, -95px) scale(1.5) rotate(-15deg); }
    }
    @keyframes floatZzz3 {
      0% { opacity: 0; transform: translate(0, 0) scale(0.7) rotate(-10deg); }
      30% { opacity: 1; }
      100% { opacity: 0; transform: translate(18px, -115px) scale(1.7) rotate(15deg); }
    }

    .zzz-1 { animation: floatZzz1 3.2s infinite ease-out; animation-delay: 0s; }
    .zzz-2 { animation: floatZzz2 3.2s infinite ease-out; animation-delay: 1.1s; }
    .zzz-3 { animation: floatZzz3 3.2s infinite ease-out; animation-delay: 2.2s; }

    /* Raccoon breathing animation */
    @keyframes breathe {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-3.5px) scale(1.018); }
    }
    .anim-breathe {
      animation: breathe 3.6s infinite ease-in-out;
      transform-origin: bottom center;
    }

    /* Tail wiggle animation */
    @keyframes tailWiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg); }
    }
    .anim-tail {
      animation: tailWiggle 4s infinite ease-in-out;
      transform-origin: 320px 240px;
    }

    /* Ears tremble when startled */
    @keyframes earWiggle {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-10deg); }
      40% { transform: rotate(12deg); }
      60% { transform: rotate(-8deg); }
      80% { transform: rotate(8deg); }
    }
    .anim-ear-left { animation: earWiggle 0.35s infinite ease-in-out; transform-origin: 130px 130px; }
    .anim-ear-right { animation: earWiggle 0.35s infinite ease-in-out; transform-origin: 270px 130px; }

    /* Raccoon startled jump */
    @keyframes startleJump {
      0% { transform: translateY(0) scale(1); }
      20% { transform: translateY(-28px) scale(1.09) rotate(-2deg); }
      40% { transform: translateY(-12px) scale(1.02) rotate(2deg); }
      60% { transform: translateY(-20px) scale(1.06) rotate(-1deg); }
      80% { transform: translateY(-4px) scale(1); }
      100% { transform: translateY(0) scale(1); }
    }
    .anim-startle {
      animation: startleJump 0.65s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-origin: bottom center;
    }

    /* Screen / Room shake on loud noise */
    @keyframes roomShake {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-7px, 5px); }
      40% { transform: translate(7px, -5px); }
      60% { transform: translate(-5px, -3px); }
      80% { transform: translate(5px, 3px); }
      100% { transform: translate(0, 0); }
    }
    .shake-room {
      animation: roomShake 0.4s ease-in-out;
    }

    /* Custom range slider styling */
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 22px;
      width: 22px;
      border-radius: 50%;
      background: #f43f5e;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      transition: transform 0.15s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Glowing stars animation */
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.25); }
    }
    .star-1 { animation: starTwinkle 2s infinite ease-in-out 0.2s; }
    .star-2 { animation: starTwinkle 2.6s infinite ease-in-out 0.8s; }
    .star-3 { animation: starTwinkle 1.9s infinite ease-in-out 1.3s; }

    /* Speech Bubble Pop */
    @keyframes bubblePop {
      0% { opacity: 0; transform: scale(0.5) translateY(12px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .anim-pop {
      animation: bubblePop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* FULLSCREEN LAYOUT OVERRIDES */
    body.fullscreen-active {
      overflow: hidden;
      background-color: #030712;
    }
    body.fullscreen-active #appContainer {
      max-width: 100vw !important;
      height: 100vh !important;
      padding: 0.75rem !important;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    body.fullscreen-active #roomContainer {
      flex: 1;
      min-height: 0 !important;
      height: 100% !important;
      border-radius: 1.75rem;
    }
    body.fullscreen-active #raccoonSvg {
      max-height: 55vh;
      width: auto;
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-3 md:p-6 overflow-x-hidden selection:bg-rose-500 selection:text-white">

  <!-- Main Container -->
  <div id="appContainer" class="w-full max-w-5xl flex flex-col gap-4 my-auto transition-all duration-300">

    <!-- Top Header Bar -->

      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-indigo-500/20 border border-indigo-500/30 flex items-center justify-center text-xl shadow-inner">
          🦝
        </div>
        <div>

            安靜！別吵醒睡覺的可愛浣熊 💤

          <p class="text-xs text-slate-400">麥克風分貝感應 · 可愛浣熊互動 · 繁體中文語音朗讀</p>
        </div>
      </div>

      <!-- Action Pill & Fullscreen Toggle Button -->
      <div class="flex items-center gap-2">

        </div>

        <!-- Fullscreen Button -->

        </button>

    </header>

    <!-- Main Content Area: Room Stage + Control Panel -->
    <main id="mainLayout" class="w-full grid grid-cols-1 lg:grid-cols-12 gap-5 items-stretch">
      
      <!-- LEFT: Bedroom Stage (7 cols) -->
      <div id="roomContainer" class="lg:col-span-7 relative bg-gradient-to-b from-indigo-950 via-slate-900 to-slate-950 rounded-3xl p-5 md:p-8 border-2 border-indigo-900/60 shadow-2xl shadow-indigo-950/60 flex flex-col items-center justify-center min-h-[380px] md:min-h-[440px] overflow-hidden transition-all duration-300 group">
        
        <!-- Floating Fullscreen Exit Quick Button -->

        </button>

        <!-- Moon in Top Left -->

            <div class="absolute top-0 right-0 w-10 h-10 rounded-full bg-indigo-950"></div>
          </div>
        </div>

        <!-- Background Stars -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none opacity-50" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12%" cy="18%" r="2" fill="#fff" class="star-1" />
          <circle cx="88%" cy="14%" r="2.5" fill="#fef08a" class="star-2" />
          <circle cx="78%" cy="38%" r="1.5" fill="#fff" class="star-3" />
          <circle cx="22%" cy="42%" r="2" fill="#fed7aa" class="star-2" />
          <circle cx="92%" cy="68%" r="1.8" fill="#fff" class="star-1" />
          <circle cx="8%" cy="78%" r="2" fill="#fef08a" class="star-3" />
        </svg>

        <!-- Warm Room Light Glow -->

        <!-- Floating Zzz Letters Container -->

          <span class="absolute zzz-2 text-3xl font-black opacity-0">z</span>
          <span class="absolute zzz-3 text-4xl font-black opacity-0">z</span>

        <!-- Exclamation Mark when woken up -->

            🍱 抬餐桶警告！
          </span>
        </div>

        <!-- Dialogue Speech Bubble -->
        <div id="speechBubble" class="absolute top-6 left-1/2 transform -translate-x-1/2 opacity-0 transition-all duration-300 pointer-events-none z-20 max-w-[88%] text-center">
          <div class="bg-white/95 text-slate-900 font-bold text-xs md:text-sm px-4 py-2 rounded-2xl shadow-2xl border-2 border-slate-200 relative">
            <span id="speechText">吵醒我，讓你抬餐桶唷！</span>
            <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-0 h-0 border-l-8 border-l-transparent border-r-8 border-r-transparent border-t-8 border-t-white/95"></div>
          </div>
        </div>

        <!-- MAIN SVG RACCOON & BEDROOM SCENE -->
        <div id="raccoonWrapper" class="relative z-10 cursor-pointer transform hover:scale-[1.02] transition-transform duration-200" title="點擊戳戳可愛浣熊！">

            <!-- Bed Pillow -->

            <rect x="80" y="140" width="240" height="75" rx="22" fill="#F8FAFC" />

            <!-- Raccoon Main Character Group -->
            <g id="raccoonCharacter" class="anim-breathe">

              <!-- Fluffy Striped Tail -->
              <g id="raccoonTail" class="anim-tail">

                <path d="M 322 250 Q 355 265 328 280" stroke="#1E293B" stroke-width="12" stroke-linecap="round" fill="none" />
                <path d="M 310 280 Q 330 295 305 305" stroke="#1E293B" stroke-width="10" stroke-linecap="round" fill="none" />
              </g>
              
              <!-- Left Ear -->
              <g id="earLeft">
                <polygon points="110,145 140,85 175,135" fill="#475569" stroke="#1E293B" stroke-width="4" stroke-linejoin="round" />
                <polygon points="120,140 142,98 165,132" fill="#E2E8F0" />
              </g>

              <!-- Right Ear -->
              <g id="earRight">
                <polygon points="225,135 260,85 290,145" fill="#475569" stroke="#1E293B" stroke-width="4" stroke-linejoin="round" />
                <polygon points="235,132 258,98 280,140" fill="#E2E8F0" />
              </g>

              <!-- Head Base (Gray) -->
              <ellipse cx="200" cy="170" rx="82" ry="72" fill="#64748B" stroke="#1E293B" stroke-width="4" />

              <!-- White Cheek Fur Badges -->
              <path d="M 120 170 Q 140 215 170 210 Q 130 200 120 170 Z" fill="#F8FAFC" />
              <path d="M 280 170 Q 260 215 230 210 Q 270 200 280 170 Z" fill="#F8FAFC" />

              <!-- Raccoon Iconic Bandit Eye Mask (Dark Black/Gray Patch) -->
              <path d="M 130 168 C 140 148 185 155 200 170 C 215 155 260 148 270 168 C 275 190 220 205 200 180 C 180 205 125 190 130 168 Z" fill="#1E293B" stroke="#0F172A" stroke-width="3" />

              <!-- White Snout Area -->
              <ellipse cx="200" cy="190" rx="30" ry="22" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
              <!-- Dark Nose -->
              <polygon points="193,178 207,178 200,188" fill="#0F172A" rx="2" />

              <!-- Cheeks Pink Blush -->
              <ellipse cx="138" cy="192" rx="11" ry="7" fill="#FF8A8A" opacity="0.6" />
              <ellipse cx="262" cy="192" rx="11" ry="7" fill="#FF8A8A" opacity="0.6" />

              <!-- SLEEPING EYES (Default Arcs) -->
              <g id="eyesSleeping" class="transition-opacity duration-200">
                <path d="M 150 172 Q 162 182 174 172" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
                <path d="M 226 172 Q 238 182 250 172" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
              </g>

              <!-- AWAKE EYES (Hidden by default) -->
              <g id="eyesAwake" class="opacity-0 transition-opacity duration-200">
                <circle cx="162" cy="170" r="13" fill="#FFFFFF" />
                <circle cx="238" cy="170" r="13" fill="#FFFFFF" />
                <circle cx="162" cy="170" r="8" fill="#0F172A" />
                <circle cx="238" cy="170" r="8" fill="#0F172A" />
                <!-- Eye shine highlights -->
                <circle cx="159" cy="167" r="3.5" fill="#FFFFFF" />
                <circle cx="235" cy="167" r="3.5" fill="#FFFFFF" />
                <!-- Surprised eyebrows -->
                <path d="M 148 148 Q 162 140 176 148" fill="none" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" />
                <path d="M 224 148 Q 238 140 252 148" fill="none" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" />
              </g>

              <!-- SLEEPING MOUTH -->
              <path id="mouthSleeping" d="M 194 198 Q 200 204 206 198" fill="none" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round" />

              <!-- AWAKE MOUTH (Shocked 'O' - Hidden by default) -->

              <!-- Paws / Arms resting -->
              <ellipse cx="140" cy="222" rx="16" ry="12" fill="#475569" stroke="#1E293B" stroke-width="3" />
              <ellipse cx="260" cy="222" rx="16" ry="12" fill="#475569" stroke="#1E293B" stroke-width="3" />

              <!-- Nightcap (Cozy Sleep Hat) -->
              <path d="M 135 125 Q 195 50 270 95 C 290 155 315 175 305 190 C 295 200 280 185 275 170 C 255 125 195 95 135 125 Z" fill="#a855f7" stroke="#7e22ce" stroke-width="3" />
              <!-- Cap Brim / Fold -->
              <path d="M 138 132 Q 200 100 268 118" fill="none" stroke="#c084fc" stroke-width="12" stroke-linecap="round" />
              <path d="M 138 132 Q 200 100 268 118" fill="none" stroke="#f3e8ff" stroke-width="6" stroke-linecap="round" />
              <!-- Nightcap Pompom -->
              <circle cx="307" cy="191" r="14" fill="#FDE047" stroke="#EAB308" stroke-width="3" />

            </g> <!-- End Raccoon Character Group -->

            <!-- MINI LUNCH BUCKET PLUSH COMPANION (餐桶圖案) tucked under blanket -->
            <g id="miniBucket" class="anim-breathe">
              <!-- Bucket Body -->
              <rect x="282" y="202" width="30" height="26" rx="5" fill="#CBD5E1" stroke="#475569" stroke-width="2.5" />
              <rect x="280" y="198" width="34" height="6" rx="2" fill="#94A3B8" stroke="#475569" stroke-width="2" />
              <!-- Handle -->
              <path d="M 286 198 Q 297 186 308 198" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
              <!-- Cute Rice / Star detail -->
              <circle cx="297" cy="215" r="3" fill="#F43F5E" />
            </g>

            <!-- Cozy Blanket (Covering lower body) -->

              <path d="M 55 225 Q 200 210 345 225 L 355 320 Q 200 330 45 320 Z" fill="#0EA5E9" stroke="#0284C7" stroke-width="4" />
              <!-- Blanket Patterns (Paw Prints & Stars) -->
              <circle cx="105" cy="255" r="5" fill="#BAE6FD" opacity="0.85" />
              <circle cx="175" cy="275" r="7" fill="#BAE6FD" opacity="0.85" />
              <circle cx="245" cy="250" r="6" fill="#BAE6FD" opacity="0.85" />
              <circle cx="295" cy="280" r="5" fill="#BAE6FD" opacity="0.85" />
              <circle cx="135" cy="295" r="6" fill="#BAE6FD" opacity="0.85" />
              <!-- Blanket Fold Edge -->
              <path d="M 53 226 Q 200 211 347 226" fill="none" stroke="#E0F2FE" stroke-width="8" stroke-linecap="round" />

          </svg>
        </div>

        <!-- State Status Badge -->
        <div id="statusBadge" class="mt-2 inline-flex items-center gap-2 bg-indigo-900/80 border border-indigo-700/60 px-4 py-1.5 rounded-full shadow-lg transition-all">
          <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-blue-400 animate-ping"></span>
          <span id="statusText" class="text-xs md:text-sm font-bold text-indigo-200">香甜熟睡中... (Zzz)</span>
        </div>

        <!-- Touch Hint -->
        <div class="mt-2 text-[11px] md:text-xs text-slate-500 font-medium">
          💡 提示：點擊或觸摸浣熊可以戳戳互動喔！
        </div>

      </div>

      <!-- RIGHT: Control Panel & Settings (5 cols) -->
      <div class="lg:col-span-5 flex flex-col gap-4">
        
        <!-- Custom Warning Input Box -->
        <div class="bg-slate-900/80 border border-slate-800 rounded-3xl p-4 md:p-5 shadow-xl backdrop-blur-md flex flex-col gap-2.5">
          <label for="customDialogueInput" class="text-xs font-bold text-amber-300 flex items-center justify-between">
            <span>🗣️ 自訂吵醒喊話台詞：</span>
            <span class="text-[10px] text-slate-400 font-normal">（留空則隨機發言）</span>
          </label>
          <div class="flex gap-2">
            <input id="customDialogueInput" type="text" placeholder="吵醒我，讓你抬餐桶唷！" value="吵醒我，讓你抬餐桶唷！" class="flex-1 bg-slate-950 border border-slate-700 focus:border-amber-400 text-slate-100 text-xs md:text-sm rounded-2xl px-3.5 py-2 outline-none transition-all" />
            <button id="ttsToggleBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 py-2 rounded-2xl text-xs flex items-center gap-1 transition-all shrink-0">
              <span id="ttsIcon">🔊</span>
              <span id="ttsStatusText">語音：開</span>
            </button>
          </div>
        </div>

        <!-- Microphone & Sound Meter Box -->
        <div class="bg-slate-900/80 border border-slate-800 rounded-3xl p-4 md:p-5 shadow-xl backdrop-blur-md flex flex-col gap-4">
          
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <div id="micIconBg" class="w-10 h-10 rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 transition-colors">
                <svg id="micIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 016 0v6a3 3 0 01-3 3z" />
                </svg>
              </div>
              <div>
                <h2 class="font-bold text-slate-100 text-sm md:text-base">麥克風音量監測</h2>
                <p id="micStatusSub" class="text-xs text-slate-400">點擊按鈕開啟麥克風</p>
              </div>
            </div>

            <button id="toggleMicBtn" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-slate-950 font-bold px-4 py-2 rounded-2xl text-xs md:text-sm transition-all shadow-md flex items-center gap-1.5">
              <span>開啟麥克風</span>
            </button>
          </div>

          <hr class="border-slate-800" />

          <!-- Volume Bar Meter -->
          <div class="flex flex-col gap-1.5">
            <div class="flex justify-between items-center text-xs font-bold text-slate-300">
              <span>即時環境音量 (Volume Meter)</span>
              <span id="volumeValue" class="text-emerald-400 font-mono text-sm">0%</span>
            </div>

            <div class="relative w-full h-6 bg-slate-950 rounded-xl overflow-hidden border border-slate-800 p-0.5">
              <!-- Volume Fill -->
              <div id="volumeBar" class="h-full bg-gradient-to-r from-emerald-500 via-amber-400 to-rose-500 rounded-lg transition-all duration-75 w-0"></div>
              
              <!-- Threshold Red Line Marker -->
              <div id="thresholdMarker" class="absolute top-0 bottom-0 w-1 bg-rose-500 shadow-[0_0_10px_#f43f5e] z-10 transition-all duration-150" style="left: 35%;">
                <div class="absolute -top-1 -translate-x-1/2 w-2.5 h-2.5 bg-rose-500 rotate-45 rounded-sm"></div>
              </div>
            </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-800/95 text-slate-100 border border-slate-700 px-5 py-2.5 rounded-2xl shadow-2xl text-xs md:text-sm font-semibold opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center gap-2 backdrop-blur-md">

    <footer class="text-center text-[11px] text-slate-500 py-1">
      Cute Sleeping Raccoon Noise Detector · Web Audio API & Speech Synthesis Powered
    </footer>

  </div>


  <!-- JAVASCRIPT LOGIC -->
  <script>
    /* ==========================================================
       STATE & VARIABLES
       ========================================================== */
    const STATES = {
      SLEEPING: 'SLEEPING',
      AWAKE: 'AWAKE',
      FALLING_ASLEEP: 'FALLING_ASLEEP'
    };

    let currentState = STATES.SLEEPING;
    let micActive = false;
    let audioCtx = null;
    let analyser = null;
    let micStream = null;
    let animFrameId = null;

    let currentVolume = 0;
    let threshold = 35; // Percentage threshold
    let quietTimer = null;
    let isLampOn = false;
    let isMoonOn = true;
    let isTtsEnabled = true;

    // Traditional Chinese Dialogues for Raccoon
    const wakeDialogues = [
      "吵醒我，讓你抬餐桶唷！ 🍱",
      "太吵了！明天午餐你負責抬餐桶！ 🍱💥",
      "是誰那麼吵？！人家在做夢夢到棉花糖欸！ 🦝",
      "吵死人了！再吵罰你抬重重的大餐桶！ 😡",
      "噓！可以小聲一點嗎？！浣熊要生氣囉！ 🤫"
    ];

    const sleepDialogues = [
      "哈啊～好睏喔... 繼續回去睡覺囉... 🥱",
      "呼... 終於安靜了... 晚安 Zzz 😴",
      "揉揉小臉... 重新回到夢鄉 💤",
      "別再吵我囉... 抱緊午餐桶... 🍱"
    ];

    const pokeDialogues = [
      "嗯... 誰在戳我？別鬧啦～ 🐾",
      "痛痛！戳人家肚子幹嘛啦！ 🙈",
      "再戳我就真的要讓你抬餐桶囉！ 🍱",
      "別戳啦～好癢喔嘻嘻 😜"
    ];

    /* ==========================================================
       DOM ELEMENTS
       ========================================================== */
    const appContainer = document.getElementById('appContainer');
    const roomContainer = document.getElementById('roomContainer');
    const roomGlow = document.getElementById('roomGlow');
    const moonElement = document.getElementById('moonElement');
    const zzzContainer = document.getElementById('zzzContainer');
    const exclamationMark = document.getElementById('exclamationMark');
    const speechBubble = document.getElementById('speechBubble');
    const speechText = document.getElementById('speechText');
    const raccoonCharacter = document.getElementById('raccoonCharacter');
    const earLeft = document.getElementById('earLeft');
    const earRight = document.getElementById('earRight');
    const eyesSleeping = document.getElementById('eyesSleeping');
    const eyesAwake = document.getElementById('eyesAwake');
    const mouthSleeping = document.getElementById('mouthSleeping');
    const mouthAwake = document.getElementById('mouthAwake');
    const raccoonWrapper = document.getElementById('raccoonWrapper');

    const statusBadge = document.getElementById('statusBadge');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    const toggleMicBtn = document.getElementById('toggleMicBtn');
    const micIconBg = document.getElementById('micIconBg');
    const micStatusSub = document.getElementById('micStatusSub');
    const headerMicDot = document.getElementById('headerMicDot');
    const headerMicText = document.getElementById('headerMicText');

    const volumeValue = document.getElementById('volumeValue');
    const volumeBar = document.getElementById('volumeBar');
    const thresholdMarker = document.getElementById('thresholdMarker');
    const thresholdSlider = document.getElementById('thresholdSlider');
    const thresholdValText = document.getElementById('thresholdValText');

    const customDialogueInput = document.getElementById('customDialogueInput');
    const ttsToggleBtn = document.getElementById('ttsToggleBtn');
    const ttsIcon = document.getElementById('ttsIcon');
    const ttsStatusText = document.getElementById('ttsStatusText');

    const testNoiseBtn = document.getElementById('testNoiseBtn');
    const pokeRaccoonBtn = document.getElementById('pokeRaccoonBtn');
    const toggleLampBtn = document.getElementById('toggleLampBtn');
    const toggleMoonBtn = document.getElementById('toggleMoonBtn');

    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const floatingFsBtn = document.getElementById('floatingFsBtn');
    const fsBtnIcon = document.getElementById('fsBtnIcon');
    const fsBtnText = document.getElementById('fsBtnText');

    /* ==========================================================
       FULLSCREEN API SUPPORT
       ========================================================== */
    function toggleFullscreen() {
      const elem = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement && !document.msFullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) {
          elem.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) {
          document.msExitFullscreen();
        }
      }
    }

    function handleFullscreenChange() {
      const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
      
      if (isFS) {
        document.body.classList.add('fullscreen-active');
        fsBtnText.innerText = "退出全螢幕";
        fsBtnIcon.innerText = "↙";
        floatingFsBtn.classList.remove('hidden');
        showToast("已進入全螢幕沉浸模式 🌙", "⛶");
      } else {
        document.body.classList.remove('fullscreen-active');
        fsBtnText.innerText = "全螢幕模式";
        fsBtnIcon.innerText = "⛶";
        floatingFsBtn.classList.add('hidden');
        showToast("已退出全螢幕模式", "📱");
      }
    }

    fullscreenBtn.addEventListener('click', toggleFullscreen);
    floatingFsBtn.addEventListener('click', toggleFullscreen);

    document.addEventListener('fullscreenchange', handleFullscreenChange);
    document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
    document.addEventListener('mozfullscreenchange', handleFullscreenChange);
    document.addEventListener('MSFullscreenChange', handleFullscreenChange);

    /* ==========================================================
       TEXT-TO-SPEECH (TTS) VOICE SYNTHESIS
       ========================================================== */
    function speakDialogue(text) {
      if (!isTtsEnabled || !('speechSynthesis' in window)) return;

      // Clean string for speech (remove emojis if needed)
      const cleanText = text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '');

      window.speechSynthesis.cancel(); // Interrupt previous speech

      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'zh-TW';
      utterance.pitch = 1.35; // Cute slightly higher pitch for raccoon
      utterance.rate = 1.05;  // Slightly lively speed

      window.speechSynthesis.speak(utterance);
    }

    ttsToggleBtn.addEventListener('click', () => {
      isTtsEnabled = !isTtsEnabled;
      if (isTtsEnabled) {
        ttsIcon.innerText = "🔊";
        ttsStatusText.innerText = "語音：開";
        ttsToggleBtn.className = "bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 py-2 rounded-2xl text-xs flex items-center gap-1 transition-all shrink-0";
        showToast("已開啟語音朗讀 🗣️");
        speakDialogue("語音已開啟！");
      } else {
        window.speechSynthesis.cancel();
        ttsIcon.innerText = "🔇";
        ttsStatusText.innerText = "語音：關";
        ttsToggleBtn.className = "bg-slate-800 text-slate-400 font-bold px-3 py-2 rounded-2xl text-xs flex items-center gap-1 transition-all shrink-0 border border-slate-700";
        showToast("已靜音語音朗讀 🔇");
      }
    });

    /* ==========================================================
       WEB AUDIO SYNTHESIZER (Pure JS SFX)
       ========================================================== */
    function initAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Cute startled chirp sound
    function playStartleSound() {
      initAudioContext();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;

      // Pitch chirp
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'triangle';
      osc1.frequency.setValueAtTime(320, now);
      osc1.frequency.exponentialRampToValueAtTime(980, now + 0.12);
      osc1.frequency.exponentialRampToValueAtTime(680, now + 0.25);

      gain1.gain.setValueAtTime(0.3, now);
      gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.28);

      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);

      osc1.start(now);
      osc1.stop(now + 0.28);
    }

    function playYawnSound() {
      initAudioContext();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(500, now);
      osc.frequency.linearRampToValueAtTime(360, now + 0.4);
      osc.frequency.linearRampToValueAtTime(210, now + 1.2);

      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.18, now + 0.35);
      gain.gain.linearRampToValueAtTime(0.001, now + 1.25);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 1.25);
    }

    function playPokeSound() {
      initAudioContext();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(580, now);
      osc.frequency.exponentialRampToValueAtTime(1350, now + 0.1);

      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.13);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.13);
    }

    /* ==========================================================
       MICROPHONE NOISE DETECTION
       ========================================================== */
    async function toggleMicrophone() {
      if (micActive) {
        stopMicrophone();
        showToast("麥克風監測已關閉", "🎤");
        return;
      }

      try {
        initAudioContext();
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        
        const source = audioCtx.createMediaStreamSource(micStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.45;
        source.connect(analyser);

        micActive = true;
        updateMicUI(true);
        showToast("麥克風已開啟！試著說話或拍手測試分貝喔～", "🎙️");

        analyzeAudio();
      } catch (err) {
        console.error("Microphone access error:", err);
        showToast("無法取得麥克風權限，您仍可點擊「拍手測試」按鈕互動！", "⚠️");
      }
    }

    function stopMicrophone() {
      micActive = false;
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
        micStream = null;
      }
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
      }
      updateMicUI(false);
      updateVolumeMeter(0);
    }

    function updateMicUI(active) {
      if (active) {
        toggleMicBtn.innerHTML = `<span>關閉麥克風</span>`;
        toggleMicBtn.className = "bg-rose-500 hover:bg-rose-600 active:scale-95 text-white font-bold px-4 py-2 rounded-2xl text-xs md:text-sm transition-all shadow-md flex items-center gap-1.5";
        micIconBg.className = "w-10 h-10 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center transition-colors border border-emerald-500/30";
        micStatusSub.innerText = "即時監聽環境音量中...";
        micStatusSub.className = "text-xs text-emerald-400 font-medium";

        headerMicDot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-ping";
        headerMicText.innerText = "麥克風監聽中";
        headerMicText.className = "text-emerald-300 font-medium";
      } else {
        toggleMicBtn.innerHTML = `<span>開啟麥克風</span>`;
        toggleMicBtn.className = "bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-slate-950 font-bold px-4 py-2 rounded-2xl text-xs md:text-sm transition-all shadow-md flex items-center gap-1.5";
        micIconBg.className = "w-10 h-10 rounded-2xl bg-slate-800 text-slate-300 flex items-center justify-center transition-colors border border-slate-700";
        micStatusSub.innerText = "點擊按鈕開啟麥克風";
        micStatusSub.className = "text-xs text-slate-400";

        headerMicDot.className = "w-2 h-2 rounded-full bg-slate-500";
        headerMicText.innerText = "麥克風未開啟";
        headerMicText.className = "text-slate-400 font-medium";
      }
    }

    function analyzeAudio() {
      if (!micActive || !analyser) return;

      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);

      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        sum += dataArray[i];
      }
      let avg = sum / dataArray.length;

      // Scale to 0-100%
      let vol = Math.min(100, Math.round((avg / 110) * 100));

      updateVolumeMeter(vol);
      processNoiseLevel(vol);

      animFrameId = requestAnimationFrame(analyzeAudio);
    }

    function updateVolumeMeter(vol) {
      currentVolume = vol;
      volumeValue.innerText = `${vol}%`;
      volumeBar.style.width = `${vol}%`;

      if (vol >= threshold) {
        volumeValue.className = "text-rose-400 font-mono text-sm font-black animate-pulse";
      } else {
        volumeValue.className = "text-emerald-400 font-mono text-sm font-bold";
      }
    }

    /* ==========================================================
       RACCOON ANIMATION & STATE MACHINE
       ========================================================== */
    function processNoiseLevel(vol) {
      if (vol >= threshold) {
        wakeRaccoonUp();
      } else {
        if (currentState === STATES.AWAKE) {
          if (!quietTimer) {
            quietTimer = setTimeout(() => {
              fallBackAsleep();
            }, 3200);
          }
        }
      }
    }

    function getActiveDialogue() {
      const customVal = customDialogueInput.value.trim();
      if (customVal) {
        return customVal;
      }
      return getRandomItem(wakeDialogues);
    }

    function wakeRaccoonUp(overrideText = null) {
      if (quietTimer) {
        clearTimeout(quietTimer);
        quietTimer = null;
      }

      const activeMsg = overrideText || getActiveDialogue();

      if (currentState !== STATES.AWAKE) {
        currentState = STATES.AWAKE;
        playStartleSound();

        // 1. Room shake & red glow burst
        roomContainer.classList.add('shake-room');
        setTimeout(() => roomContainer.classList.remove('shake-room'), 400);

        roomGlow.className = "absolute inset-0 bg-rose-500/20 pointer-events-none transition-all duration-300";

        // 2. Hide Zzz, show Exclamation & Speech Bubble
        zzzContainer.style.opacity = '0';
        exclamationMark.classList.remove('opacity-0', 'scale-50');
        exclamationMark.classList.add('opacity-100', 'scale-100');

        setTimeout(() => {
          exclamationMark.classList.remove('opacity-100', 'scale-100');
          exclamationMark.classList.add('opacity-0', 'scale-50');
        }, 1400);

        speechText.innerText = activeMsg;
        speechBubble.classList.remove('opacity-0');
        speechBubble.classList.add('opacity-100', 'anim-pop');

        // Speak aloud using TTS
        speakDialogue(activeMsg);

        // 3. Raccoon SVG awake changes
        eyesSleeping.classList.add('opacity-0');
        eyesAwake.classList.remove('opacity-0');
        mouthSleeping.classList.add('opacity-0');
        mouthAwake.classList.remove('opacity-0');

        earLeft.classList.add('anim-ear-left');
        earRight.classList.add('anim-ear-right');

        raccoonCharacter.classList.remove('anim-breathe');
        raccoonWrapper.classList.add('anim-startle');

        setTimeout(() => {
          raccoonWrapper.classList.remove('anim-startle');
        }, 650);

        // 4. Update Status Badge
        statusBadge.className = "mt-2 inline-flex items-center gap-2 bg-rose-950/90 border border-rose-700/80 px-4 py-1.5 rounded-full shadow-lg transition-all";
        statusDot.className = "w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping";
        statusText.innerText = "被吵醒了！！(警告抬餐桶中)";
        statusText.className = "text-xs md:text-sm font-bold text-rose-200";
      }
    }

    function fallBackAsleep() {
      if (currentState !== STATES.AWAKE) return;

      currentState = STATES.FALLING_ASLEEP;
      playYawnSound();

      const sleepMsg = getRandomItem(sleepDialogues);
      speechText.innerText = sleepMsg;
      speakDialogue(sleepMsg);

      // Yawn animation mouth
      mouthAwake.setAttribute('rx', '10');
      mouthAwake.setAttribute('ry', '14');

      statusBadge.className = "mt-2 inline-flex items-center gap-2 bg-amber-950/90 border border-amber-700/80 px-4 py-1.5 rounded-full shadow-lg transition-all";
      statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse";
      statusText.innerText = "打哈欠中... 準備重回夢鄉 🥱";
      statusText.className = "text-xs md:text-sm font-bold text-amber-200";

      setTimeout(() => {
        if (currentState === STATES.FALLING_ASLEEP) {
          resetToSleepingState();
        }
      }, 2400);
    }

    function resetToSleepingState() {
      currentState = STATES.SLEEPING;
      quietTimer = null;

      roomGlow.className = isLampOn 
        ? "absolute inset-0 bg-amber-400/15 pointer-events-none transition-all duration-500"
        : "absolute inset-0 bg-amber-500/0 pointer-events-none transition-all duration-500";

      speechBubble.classList.remove('opacity-100', 'anim-pop');
      speechBubble.classList.add('opacity-0');
      zzzContainer.style.opacity = '1';

      eyesSleeping.classList.remove('opacity-0');
      eyesAwake.classList.add('opacity-0');
      mouthSleeping.classList.remove('opacity-0');
      mouthAwake.classList.add('opacity-0');
      mouthAwake.setAttribute('rx', '8');
      mouthAwake.setAttribute('ry', '10');

      earLeft.classList.remove('anim-ear-left');
      earRight.classList.remove('anim-ear-right');

      raccoonCharacter.classList.add('anim-breathe');

      statusBadge.className = "mt-2 inline-flex items-center gap-2 bg-indigo-900/80 border border-indigo-700/60 px-4 py-1.5 rounded-full shadow-lg transition-all";
      statusDot.className = "w-2.5 h-2.5 rounded-full bg-blue-400 animate-ping";
      statusText.innerText = "香甜熟睡中... (Zzz)";
      statusText.className = "text-xs md:text-sm font-bold text-indigo-200";
    }

    /* ==========================================================
       CONTROLS & BUTTON HANDLERS
       ========================================================== */
    thresholdSlider.addEventListener('input', (e) => {
      setSensitivity(parseInt(e.target.value));
    });

    function setSensitivity(val) {
      threshold = val;
      thresholdSlider.value = val;
      thresholdValText.innerText = `${val}%`;
      thresholdMarker.style.left = `${val}%`;
      showToast(`吵醒門檻已調整為: ${val}%`);
    }

    testNoiseBtn.addEventListener('click', () => {
      updateVolumeMeter(Math.min(100, threshold + 35));
      wakeRaccoonUp();

      setTimeout(() => {
        if (!micActive) {
          updateVolumeMeter(0);
        }
      }, 900);
    });

    function pokeRaccoon() {
      playPokeSound();

      const pokeMsg = getRandomItem(pokeDialogues);
      if (currentState === STATES.SLEEPING || currentState === STATES.FALLING_ASLEEP) {
        wakeRaccoonUp(pokeMsg);
      } else {
        speechText.innerText = pokeMsg;
        speakDialogue(pokeMsg);
        raccoonWrapper.classList.add('anim-startle');
        setTimeout(() => raccoonWrapper.classList.remove('anim-startle'), 450);
      }
    }

    pokeRaccoonBtn.addEventListener('click', pokeRaccoon);
    raccoonWrapper.addEventListener('click', pokeRaccoon);

    // Lamp Toggle
    toggleLampBtn.addEventListener('click', () => {
      isLampOn = !isLampOn;
      if (isLampOn) {
        roomGlow.className = "absolute inset-0 bg-amber-400/18 pointer-events-none transition-all duration-500";
        toggleLampBtn.className = "bg-amber-500 text-slate-950 font-bold p-2.5 rounded-2xl shadow-md text-xs flex items-center justify-center gap-1.5 transition-all active:scale-95";
        toggleLampBtn.innerText = "💡 夜燈：亮起";
        showToast("開啟溫馨夜燈 🕯️");
      } else {
        roomGlow.className = "absolute inset-0 bg-amber-500/0 pointer-events-none transition-all duration-500";
        toggleLampBtn.className = "bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold p-2.5 rounded-2xl border border-slate-700/60 text-xs flex items-center justify-center gap-1.5 transition-all active:scale-95";
        toggleLampBtn.innerText = "💡 夜燈：關閉";
        showToast("關閉夜燈 🌙");
      }
    });

    // Moon Glow Toggle
    toggleMoonBtn.addEventListener('click', () => {
      isMoonOn = !isMoonOn;
      if (isMoonOn) {
        moonElement.className = "absolute top-5 left-6 flex items-center gap-3 opacity-90 transition-all duration-500";
        toggleMoonBtn.innerText = "🌙 月亮：亮起";
        showToast("皎潔月光照進房間 🌕");
      } else {
        moonElement.className = "absolute top-5 left-6 flex items-center gap-3 opacity-20 transition-all duration-500";
        toggleMoonBtn.innerText = "🌙 月亮：暗淡";
        showToast("月光隱藏在雲後 ☁️");
      }
    });

    toggleMicBtn.addEventListener('click', toggleMicrophone);

    /* ==========================================================
       AUTO-START MIC ON FIRST INTERACTION
       ========================================================== */
    window.addEventListener('click', function autoInitOnFirstGesture() {
      initAudioContext();
      window.removeEventListener('click', autoInitOnFirstGesture);
    }, { once: true });

    /* ==========================================================
       UTILITIES
       ========================================================== */
    function getRandomItem(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    let toastTimer = null;
    function showToast(msg, icon = '💡') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');

      toastMsg.innerText = msg;
      toastIcon.innerText = icon;

      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }

    // Initialize default threshold
    setSensitivity(35);
  </script>
</body>
</html>
