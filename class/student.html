<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>學生作業查詢系統</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #loginDiv { max-width: 400px; margin: auto; }
    #resultDiv { display: none; margin: auto; max-width: 800px; margin-top: 20px; }
    .status { margin: 5px 0; padding: 5px; border: 1px solid #ccc; }
    .未交 { background-color: #fbb; }
    .未訂正 { background-color: #ff9; }
    .OK { background-color: #9f9; }
    
    /* 左右兩欄佈局設定 */
    .assignment-container { display: flex; gap: 20px; margin-top: 15px; }
    .assignment-column { flex: 1; border: 1px dashed #aaa; padding: 10px; border-radius: 5px; min-height: 100px; }
    .column-title { margin-top: 0; border-bottom: 2px solid #333; padding-bottom: 5px; text-align: center; }

    #changePwdDiv { margin-top: 30px; padding: 10px; border: 1px solid #ccc; max-width: 400px; }
  </style>
</head>
<body>
  <h2 style="text-align:center">學生作業查詢系統</h2>

  <!-- 登入區 -->
  <!-- 登入區 -->
  <div id="loginDiv">
    <label>座號：<input type="text" id="studentId"></label><br><br>
    <label>密碼：<input type="password" id="password"></label><br><br>
    <button onclick="login()">登入</button>
    <p id="loginMsg" style="color:red"></p>
  </div>

  <!-- 查詢結果區 -->
  <div id="resultDiv">
    <h3 id="studentName"></h3>
    
    <!-- 作業結果顯示區（區分左右兩欄） -->
    <div id="assignmentResults">
      <div class="assignment-container">
        <!-- 左邊：新作業區 -->
        <div class="assignment-column">
          <h4 class="column-title">新作業區</h4>
          <div id="newAssignments"></div>
        </div>
        <!-- 右邊：舊作業區 -->
        <div class="assignment-column">
          <h4 class="column-title">舊作業區</h4>
          <div id="oldAssignments"></div>
        </div>
      </div>
      <!-- 用於顯示「未積欠作業」或「無項目」的綜合提示訊息 -->
      <div id="summaryMsg" style="margin-top: 15px;"></div>
    </div>

    <!-- 修改密碼區 -->
    <div id="changePwdDiv">
      <h4>修改密碼</h4>
      <label>新密碼：<input type="password" id="newPwd"></label><br><br>
      <button onclick="changePassword()">更新密碼</button>
      <p id="pwdMsg" style="color:blue"></p>
    </div>
  </div>

<script>
  // Firebase 初始化
  const firebaseConfig = {
    apiKey: "AIzaSyBIZByjsGNwP949OSVsyi7-PjU7Cpz-gzI",
    authDomain: "student-score-app-6cca6.firebaseapp.com",
    databaseURL: "https://student-score-app-6cca6-default-rtdb.firebaseio.com",
    projectId: "student-score-app-6cca6",
    storageBucket: "student-score-app-6cca6.firebasestorage.app",
    messagingSenderId: "887092013369",
    appId: "1:887092013369:web:42abc19c8cacca737b20e8",
    measurementId: "G-8SREJH2ER3"
  };

  const app = firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let currentId = null; // 紀錄登入中的學生座號

  function login() {
    const id = document.getElementById("studentId").value.trim();
    const pwd = document.getElementById("password").value.trim();

    if (!id || !pwd) {
      document.getElementById("loginMsg").innerText = "請輸入座號與密碼！";
      return;
    }

    db.ref("students/" + id).once("value", snapshot => {
      if (!snapshot.exists()) {
        document.getElementById("loginMsg").innerText = "查無此學生！";
        return;
      }
      const student = snapshot.val();
      const correctPwd = student.password || "8010865"; // 預設密碼

      if (pwd !== correctPwd) {
        document.getElementById("loginMsg").innerText = "密碼錯誤！";
        return;
      }

      // 登入成功
      currentId = id;
      document.getElementById("loginDiv").style.display = "none";
      document.getElementById("resultDiv").style.display = "block";
      document.getElementById("studentName").innerText = `座號：${student.id} 姓名：${student.name}`;

      // 查詢作業
      db.ref("assignments").once("value", snap => {
        const assignments = snap.val() || {};
        const newDiv = document.getElementById("newAssignments");
        const oldDiv = document.getElementById("oldAssignments");
        const summaryMsg = document.getElementById("summaryMsg");
        
        // 清空舊資料
        newDiv.innerHTML = "";
        oldDiv.innerHTML = "";
        summaryMsg.innerHTML = "";
        
        let hasNotOK = false; // 是否有未OK作業

        Object.keys(assignments).forEach(a => {
          const status = student.assignments && student.assignments[a] ? student.assignments[a] : "未交";
          
          // 只顯示狀態不是 "OK" 的作業（保留您原本的邏輯）
          if (status !== "OK") {
            hasNotOK = true;
            
            const div = document.createElement("div");
            div.className = "status " + status;
            div.innerText = `${a}：${status}`;
            
            // 關鍵判斷：名字有「舊」字就放右邊，否則放左邊
            if (a.includes("舊")) {
              oldDiv.appendChild(div);
            } else {
              newDiv.appendChild(div);
            }
          }
        });

        // 檢查各欄位是否為空並顯示提示
        if (Object.keys(assignments).length === 0) {
          summaryMsg.innerHTML = "<p>目前沒有任何作業項目。</p>";
        } else if (!hasNotOK) {
          summaryMsg.innerHTML = "<p style='color:green;font-weight:bold'>未積欠作業</p>";
        } else {
          // 如果某個區塊沒有未完成作業，給予一個簡單提示
          if (newDiv.children.length === 0) newDiv.innerHTML = "<p style='color:gray;text-align:center;'>無欠交項目</p>";
          if (oldDiv.children.length === 0) oldDiv.innerHTML = "<p style='color:gray;text-align:center;'>無欠交項目</p>";
        }
      });
    });
  }

  function changePassword() {
    const newPwd = document.getElementById("newPwd").value.trim();
    if (!newPwd) {
      document.getElementById("pwdMsg").innerText = "新密碼不可為空！";
      return;
    }

    if (!currentId) {
      document.getElementById("pwdMsg").innerText = "尚未登入！";
      return;
    }

    db.ref("students/" + currentId + "/password").set(newPwd, error => {
      if (error) {
        document.getElementById("pwdMsg").innerText = "更新失敗，請稍後再試。";
      } else {
        document.getElementById("pwdMsg").innerText = "密碼更新成功！";
        document.getElementById("newPwd").value = "";
      }
    });
  }
</script>
</body>
</html>
