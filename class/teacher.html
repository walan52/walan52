<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>學生作業確認繳交（自動日期排序）</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { border-collapse: collapse; margin-top: 20px; width: 100%; }
    th, td { border: 1px solid #999; padding: 6px; text-align: center; }
    th { background: #f0f0f0; position: sticky; top: 0; z-index: 2; }
    button { margin: 2px; }
    .未交 { background-color: #fbb; cursor: pointer; }
    .未訂正 { background-color: #ff9; cursor: pointer; }
    .未簽名 { background-color: #add8e6; cursor: pointer; color: black; } 
    .OK { background-color: #9f9; cursor: pointer; }
    .delete-btn, .edit-btn, .hide-btn { font-size: 10px; border: none; background: none; cursor: pointer; }
    .delete-btn { color: red; }
    .edit-btn { color: blue; }
    .hide-btn { color: orange; }
    #mainDiv { display: none; }
    #loginDiv { max-width: 300px; margin: auto; border: 1px solid #ccc; padding: 20px; border-radius: 6px; }
    #hiddenModal, #subAdminModal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
                   background: #fff; border: 1px solid #aaa; border-radius: 8px;
                   padding: 20px; z-index: 100; box-shadow: 0 0 10px rgba(0,0,0,0.3); }
    #hiddenList label { display: block; margin: 5px 0; }
    #overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%;
               background: rgba(0,0,0,0.5); z-index: 50; }
    #pagination { margin-top: 10px; text-align: center; }
    .net-btn { cursor: pointer; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; }
    .有網 { background-color: #4CAF50; }
    .無網 { background-color: #E53935; }
    #categorySelect, #newCategory { margin: 5px; }
    .user-tag { font-weight: bold; color: #2196F3; }
    .admin-only { display: inline-block; } /* 控制只有主管理者看的到的功能 */
  </style>
</head>
<body>
  <h2>學生作業確認繳交系統（自動日期排序）</h2>

  <!-- 登入區 -->
  <div id="loginDiv">
    <h3>管理者登入</h3>
    <label>帳號：<input type="text" id="username"></label><br><br>
    <label>密碼：<input type="password" id="password"></label><br><br>
    <button onclick="login()">登入</button>
    <p id="loginMsg" style="color:red"></p>
  </div>

  <!-- 主系統 -->
  <div id="mainDiv">
    <div style="margin-bottom: 10px; background: #eef; padding: 8px; border-radius: 4px;">
      當前登入者：<span id="currentUserDisplay" class="user-tag"></span>
      <button id="manageSubAdminBtn" class="admin-only" onclick="openSubAdminModal()" style="margin-left: 10px;">管理協助管理者</button>
    </div>

    <input type="file" id="fileInput" accept=".csv" class="admin-only">
    <input type="text" id="assignmentInput" placeholder="輸入作業名稱">
    <select id="categorySelect"></select>
    <input type="text" id="newCategory" placeholder="新增分類">
    <button onclick="addAssignment()">新增作業項目</button>
    <button onclick="openHiddenModal()">管理隱藏作業項目</button>
    
    <!-- 僅主管理者可使用匯出與匯入 -->
    <button id="exportBtn" class="admin-only" onclick="exportCSV()">匯出紀錄</button>
    <span id="importArea" class="admin-only">
      <input type="file" id="importData" accept=".csv">
      <button onclick="importCSV()">匯入資料</button>
    </span>

    <div style="margin-top:10px;">
      <label>依分類顯示：</label>
      <select id="filterCategory" onchange="renderTable()"></select>
    </div>

    <div id="pagination">
      <button onclick="prevPage()">⬅ 上一頁</button>
      <span id="pageInfo"></span>
      <button onclick="nextPage()">下一頁 ➡</button>
    </div>

    <table id="studentTable">
      <thead>
        <tr id="headerRow">
          <th>座號</th>
          <th>姓名</th>
          <th>網區狀態</th>
          <th class="action-col">操作</th>
        </tr>
      </thead>
      <tbody id="studentBody"></tbody>
    </table>
  </div>

  <!-- 遮罩與彈窗 -->
  <div id="overlay" onclick="closeAllModals()"></div>

  <!-- 隱藏作業管理彈窗 -->
  <div id="hiddenModal">
    <h3>隱藏的作業項目</h3>
    <div id="hiddenList"></div>
    <br>
    <button onclick="restoreSelected()">顯示所選作業項目</button>
    <button onclick="closeAllModals()">關閉</button>
  </div>

  <!-- 管理協助管理者彈窗 -->
  <div id="subAdminModal">
    <h3>協助管理者帳號管理</h3>
    <div style="margin-bottom: 15px;">
      <input type="text" id="newSubUser" placeholder="協助管理者帳號" style="width: 120px;">
      <input type="password" id="newSubPwd" placeholder="密碼" style="width: 120px;">
      <button onclick="addSubAdmin()">新增</button>
    </div>
    <div id="subAdminList" style="max-height: 200px; overflow-y: auto;"></div>
    <br>
    <button onclick="closeAllModals()">關閉</button>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBIZByjsGNwP949OSVsyi7-PjU7Cpz-gzI",
    authDomain: "student-score-app-6cca6.firebaseapp.com",
    databaseURL: "https://student-score-app-6cca6-default-rtdb.firebaseio.com",
    projectId: "student-score-app-6cca6",
    storageBucket: "student-score-app-6cca6.firebasestorage.app",
    messagingSenderId: "887092013369",
    appId: "1:887092013369:web:42abc19c8cacca737b20e8",
    measurementId: "G-8SREJH2ER3"
  };

  const app = firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const studentTableBody = document.getElementById("studentBody");
  const headerRow = document.getElementById("headerRow");

  let currentPage = 1;
  const itemsPerPage = 10;
  let assignmentList = [];
  let allAssignments = {};

  let currentUser = {
    username: "",
    isMainAdmin: false
  };

  function login() {
    const user = document.getElementById("username").value.trim();
    const pwd = document.getElementById("password").value.trim();
    const msg = document.getElementById("loginMsg");
    
    if(!user || !pwd) {
      msg.innerText = "請輸入帳號和密碼！";
      return;
    }

    if (user === "walan52" && pwd === "source88") {
      currentUser.username = user;
      currentUser.isMainAdmin = true;
      enterMainSystem();
      return;
    } 

    db.ref("users/" + user).once("value", snap => {
      const userData = snap.val();
      if(userData && userData.password === pwd) {
        currentUser.username = user;
        currentUser.isMainAdmin = false;
        enterMainSystem();
      } else {
        msg.innerText = "帳號或密碼錯誤！";
      }
    });
  }

  function enterMainSystem() {
    document.getElementById("loginDiv").style.display = "none";
    document.getElementById("mainDiv").style.display = "block";
    document.getElementById("currentUserDisplay").innerText = 
      `${currentUser.username} (${currentUser.isMainAdmin ? '主管理者' : '協助管理者'})`;
    
    // 依權限顯示/隱藏主管理者專屬功能
    const adminElements = document.querySelectorAll('.admin-only');
    adminElements.forEach(el => {
      el.style.display = currentUser.isMainAdmin ? 'inline-block' : 'none';
    });

    loadCategories();
    renderTable();
  }

  document.getElementById("fileInput").addEventListener("change", e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = e => {
      const rows = e.target.result.split("\n").map(r => r.split(","));
      rows.forEach(([id, name]) => {
        if (id && name) {
          const ref = db.ref("students/" + id.trim());
          ref.once("value", snap => {
            if (!snap.exists()) ref.set({ id: id.trim(), name: name.trim(), netStatus: "無網" });
          });
        }
      });
    };
    reader.readAsText(file);
  });

  function addAssignment() {
    const name = document.getElementById("assignmentInput").value.trim();
    let category = document.getElementById("categorySelect").value;
    const newCat = document.getElementById("newCategory").value.trim();
    if (!name) return;

    if (newCat) category = newCat;
    if (!category) category = "未分類";

    db.ref("assignments/" + name).set({ 
      visible: true, 
      category: category,
      createdAt: Date.now(),
      createdBy: currentUser.username
    });
    
    document.getElementById("assignmentInput").value = "";
    document.getElementById("newCategory").value = "";
  }

  function loadCategories() {
    db.ref("assignments").once("value", snap => {
      const assigns = snap.val() || {};
      
      const filteredAssigns = Object.values(assigns).filter(a => {
        if (currentUser.isMainAdmin) return true;
        return a.createdBy === currentUser.username;
      });

      const cats = new Set(filteredAssigns.map(a => a.category || "未分類"));
      const select = document.getElementById("categorySelect");
      const filter = document.getElementById("filterCategory");
      
      const currentFilterVal = filter.value || "全部";
      
      select.innerHTML = "";
      filter.innerHTML = `<option value="全部">全部</option>`;
      cats.forEach(c => {
        select.innerHTML += `<option value="${c}">${c}</option>`;
        filter.innerHTML += `<option value="${c}">${c}</option>`;
      });
      
      if([...filter.options].some(o => o.value === currentFilterVal)) {
        filter.value = currentFilterVal;
      }
    });
  }

  function renderTable() {
    db.ref("assignments").once("value", snap => {
      allAssignments = snap.val() || {};
      const selectedCategory = document.getElementById("filterCategory").value || "全部";
      
      let visible = Object.keys(allAssignments).filter(a => {
        const item = allAssignments[a];
        const categoryName = item.category || "未分類";
        
        if (!currentUser.isMainAdmin && item.createdBy !== currentUser.username) {
          return false;
        }

        if (selectedCategory === "全部" && categoryName.includes('舊')) {
          return false;
        }

        return item.visible !== false &&
               (selectedCategory === "全部" || categoryName === selectedCategory);
      });

      visible.sort((a, b) => {
        const timeA = allAssignments[a].createdAt || 0;
        const timeB = allAssignments[b].createdAt || 0;
        return timeB - timeA;
      });

      assignmentList = visible;

      const totalPages = Math.ceil(visible.length / itemsPerPage) || 1;
      if (currentPage > totalPages) currentPage = totalPages;
      updatePageInfo(totalPages);

      const start = (currentPage - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const currentAssignments = visible.slice(start, end);

      // 操作欄位根據權限控制標頭
      const actionThHtml = currentUser.isMainAdmin ? '<th>操作</th>' : '';
      headerRow.innerHTML = `<th>座號</th><th>姓名</th><th>網區狀態</th>${actionThHtml}`;
      
      currentAssignments.forEach(a => {
        let dateStr = "無日期";
        if (allAssignments[a].createdAt) {
          const dateObj = new Date(allAssignments[a].createdAt);
          const yyyy = dateObj.getFullYear();
          const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
          const dd = String(dateObj.getDate()).padStart(2, '0');
          dateStr = `${yyyy}/${mm}/${dd}`;
        }

        const creator = allAssignments[a].createdBy || "系統預設";

        const th = document.createElement("th");
        th.innerHTML = `${a}<br>
          <span style="font-size: 11px; color: #666; font-weight: normal;">${dateStr}</span><br>
          <small style="color: #444;">${allAssignments[a].category || "未分類"}</small><br>
          <small style="color: #888;">建: ${creator}</small><br>
          <button class='edit-btn' onclick="editAssignment('${a}')">修改</button>
          <button class='hide-btn' onclick="hideAssignment('${a}')">隱藏</button>
          <button class='delete-btn' onclick="deleteAssignment('${a}')">刪除</button>`;
        headerRow.appendChild(th);
      });

      db.ref("students").once("value", s2 => {
        const students = s2.val() || {};
        studentTableBody.innerHTML = "";
        Object.values(students).forEach(stu => {
          const tr = document.createElement("tr");
          const net = stu.netStatus || "無網";
          
          // 協助管理者視角隱藏刪除學生按鈕
          const actionTdHtml = currentUser.isMainAdmin 
            ? `<td><button onclick="deleteStudent('${stu.id}')">刪除</button></td>` 
            : '';

          tr.innerHTML = `
            <td>${stu.id}</td>
            <td>${stu.name}</td>
            <td><button class="net-btn ${net}" onclick="toggleNetStatus('${stu.id}','${net}')">${net}</button></td>
            ${actionTdHtml}`;

          currentAssignments.forEach(a => {
            const status = stu.assignments?.[a] || "未交";
            const td = document.createElement("td");
            td.textContent = status;
            td.className = status;
            td.onclick = () => toggleStatus(stu.id, a, status);
            tr.appendChild(td);
          });
          studentTableBody.appendChild(tr);
        });
      });
    });
  }

  function canManageAssignment(name) {
    if (currentUser.isMainAdmin) return true;
    const creator = allAssignments[name]?.createdBy;
    if (creator === currentUser.username) {
      return true;
    } else {
      alert("權限不足！協助管理者只能修改或刪除自己新增的作業。");
      return false;
    }
  }

  function editAssignment(oldName){
    if(!canManageAssignment(oldName)) return;

    const newName = prompt(`請輸入新的作業名稱（原名稱：${oldName}）`, oldName);
    if(!newName || newName.trim() === oldName) return;
    const clean = newName.trim();
    const cat = allAssignments[oldName]?.category || "未分類";
    const time = allAssignments[oldName]?.createdAt || Date.now();
    const creator = allAssignments[oldName]?.createdBy || currentUser.username;
    
    db.ref("assignments/" + clean).set({visible: true, category: cat, createdAt: time, createdBy: creator});
    db.ref("assignments/" + oldName).remove();
    db.ref("students").once("value", snap => {
      const students = snap.val() || {};
      Object.keys(students).forEach(id => {
        const oldStatus = students[id].assignments && students[id].assignments[oldName] ? students[id].assignments[oldName] : "未交";
        db.ref(`students/${id}/assignments/${clean}`).set(oldStatus);
        db.ref(`students/${id}/assignments/${oldName}`).remove();
      });
    });
  }

  function deleteAssignment(name){
    if(!canManageAssignment(name)) return;

    if(!confirm(`確定刪除作業「${name}」嗎？`)) return;
    db.ref("assignments/" + name).remove();
    db.ref("students").once("value", snap => {
      const students = snap.val() || {};
      Object.keys(students).forEach(id => db.ref(`students/${id}/assignments/${name}`).remove());
    });
  }

  function openSubAdminModal() {
    document.getElementById("subAdminModal").style.display = "block";
    document.getElementById("overlay").style.display = "block";
    renderSubAdminList();
  }

  function renderSubAdminList() {
    const listDiv = document.getElementById("subAdminList");
    db.ref("users").once("value", snap => {
      const users = snap.val() || {};
      listDiv.innerHTML = "";
      if(Object.keys(users).length === 0) {
        listDiv.innerHTML = "<p>無任何協助管理者帳號。</p>";
        return;
      }
      Object.keys(users).forEach(u => {
        const div = document.createElement("div");
        div.style.margin = "5px 0";
        div.innerHTML = `帳號：<b>${u}</b> <button onclick="deleteSubAdmin('${u}')" style="color:red; font-size:11px;">刪除帳號</button>`;
        listDiv.appendChild(div);
      });
    });
  }

  function addSubAdmin() {
    const u = document.getElementById("newSubUser").value.trim();
    const p = document.getElementById("newSubPwd").value.trim();
    if(!u || !p) {
      alert("請填寫完整的帳號與密碼！");
      return;
    }
    if(u === "walan52") {
      alert("不能使用主管理者帳號名稱！");
      return;
    }
    db.ref("users/" + u).set({ password: p }, err => {
      if(!err) {
        alert("新增成功！");
        document.getElementById("newSubUser").value = "";
        document.getElementById("newSubPwd").value = "";
        renderSubAdminList();
      }
    });
  }

  function deleteSubAdmin(u) {
    if(confirm(`確定刪除協助管理者「${u}」的帳號密碼嗎？`)) {
      db.ref("users/" + u).remove().then(() => renderSubAdminList());
    }
  }

  function closeAllModals() {
    document.getElementById("hiddenModal").style.display = "none";
    document.getElementById("subAdminModal").style.display = "none";
    document.getElementById("overlay").style.display = "none";
  }

  function updatePageInfo(totalPages){document.getElementById("pageInfo").textContent=`第 ${currentPage} 頁 / 共 ${totalPages} 頁`;}
  function nextPage(){const totalPages=Math.ceil(assignmentList.length/itemsPerPage);if(currentPage<totalPages){currentPage++;renderTable();}}
  function prevPage(){if(currentPage>1){currentPage--;renderTable();}}

  function toggleStatus(id, name, status) {
    const needSignatureKeywords = ["聯絡簿", "聽寫", "平考", "小考", "月卷", "社平考", "社小考", "社月卷", "社練卷"];
    const requiresSignature = needSignatureKeywords.some(keyword => name.includes(keyword));

    let next = "未交";

    if (requiresSignature) {
      if (status === "未交") next = "未訂正";
      else if (status === "未訂正") next = "未簽名";
      else if (status === "未簽名") next = "OK";
      else next = "未交";
    } else {
      if (status === "未交") next = "未訂正";
      else if (status === "未訂正") next = "OK";
      else next = "未交";
    }

    db.ref(`students/${id}/assignments/${name}`).set(next);
  }

  function toggleNetStatus(id,current){const next=current==="有網"?"無網":"有網";db.ref(`students/${id}/netStatus`).set(next);}
  
  function deleteStudent(id){
    if(!currentUser.isMainAdmin) {
      alert("權限不足！只有主管理者可以刪除學生紀錄。");
      return;
    }
    if(confirm("確定刪除這位學生嗎？")) db.ref("students/"+id).remove();
  }
  
  function hideAssignment(name){
    if(!canManageAssignment(name)) return;
    db.ref(`assignments/${name}/visible`).set(false);
  }

  function openHiddenModal(){
    const modal=document.getElementById("hiddenModal");
    const overlay=document.getElementById("overlay");
    const list=document.getElementById("hiddenList");
    list.innerHTML="";
    db.ref("assignments").once("value",snap=>{
      const assignments=snap.val()||{};
      const hidden=Object.keys(assignments).filter(k => {
        const item = assignments[k];
        if(!currentUser.isMainAdmin && item.createdBy !== currentUser.username) return false;
        return item.visible === false;
      });

      if(hidden.length===0){
        list.innerHTML="<p>目前沒有隱藏的作業項目。</p>";
      }else{
        hidden.forEach(name=>{
          const label=document.createElement("label");
          label.innerHTML=`<input type="checkbox" value="${name}"> ${name}`;
          list.appendChild(label);
        });
      }
      modal.style.display="block";
      overlay.style.display="block";
    });
  }

  function restoreSelected(){
    const checkboxes=document.querySelectorAll("#hiddenList input[type=checkbox]:checked");
    checkboxes.forEach(cb=>db.ref(`assignments/${cb.value}/visible`).set(true));
    alert("已顯示所選作業項目！");
    closeAllModals();
  }
  
  function exportCSV(){
    if(!currentUser.isMainAdmin) {
      alert("權限不足！協助管理者無法使用匯出功能。");
      return;
    }
    db.ref("students").once("value",snap=>{
      const students=snap.val();
      if(!students)return;
      const headers=["座號","姓名","網區狀態"];
      const visibleAssignments=assignmentList;
      headers.push(...visibleAssignments);
      let csv=headers.join(",")+"\n";
      Object.values(students).forEach(stu=>{
        const row=[stu.id,stu.name,stu.netStatus||"無網"];
        visibleAssignments.forEach(a=>row.push(stu.assignments&&stu.assignments[a]?stu.assignments[a]:"未交"));
        csv+=row.join(",")+"\n";
      });
      const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
      const a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download="作業紀錄.csv";
      a.click();
    });
  }

  function importCSV(){
    if(!currentUser.isMainAdmin) {
      alert("權限不足！協助管理者無法使用匯入功能。");
      return;
    }
    const fileInput = document.getElementById("importData");
    const file = fileInput.files[0];
    if(!file){ alert("請選擇要匯入的 CSV 檔案"); return; }
    const reader = new FileReader();
    reader.onload = function(e){
      const text = e.target.result;
      const rows = text.split("\n").map(r => r.split(","));
      if(rows.length < 2) return;
      const headers = rows[0].map(h => h.trim().replace(/^\uFEFF/, ""));
      const assignmentHeaders = headers.slice(3);
      for(let i=1; i<rows.length; i++){
        const row = rows[i];
        if(row.length < 3 || !row[0]) continue;
        const id = row[0].trim();
        const name = row[1].trim();
        const netStatus = row[2].trim();
        const stuRef = db.ref("students/" + id);
        stuRef.update({ id, name, netStatus });
        assignmentHeaders.forEach((aName, idx) => {
          if(aName && row[3+idx]){
            db.ref(`students/${id}/assignments/${aName}`).set(row[3+idx].trim());
            db.ref(`assignments/${aName}`).once("value", snap => {
              if(!snap.exists()){ db.ref(`assignments/${aName}`).set({ visible: true, category: "未分類", createdAt: Date.now(), createdBy: currentUser.username }); }
            });
          }
        });
      }
      alert("資料匯入成功！");
      fileInput.value = "";
    };
    reader.readAsText(file);
  }

  // 監聽 Firebase 變化
  db.ref("assignments").on("value", () => {
    if (currentUser.username) {
      loadCategories();
      renderTable();
    }
  });
  db.ref("students").on("value", () => {
    if (currentUser.username) {
      renderTable();
    }
  });
</script>
</body>
</html>
