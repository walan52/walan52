<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>課堂即時回應系統（學生端）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
  <style>
    html, body { height:100%; margin:0; padding:0; background:#f9f9f9; font-family:"微軟正黑體"; }
    .box { background:white; padding:20px; border-radius:10px; box-shadow:0 0 8px rgba(0,0,0,0.1); max-width:400px; margin:20px auto; box-sizing:border-box; }
    input, button, textarea { margin:10px 0; padding:14px; width:80%; border-radius:5px; border:1px solid #ccc; font-size:18px; box-sizing:border-box; font-family:"微軟正黑體"; }
    button { background:#3498db; color:white; border:none; cursor:pointer; transition:all 0.3s ease; }
    button:hover:not(:disabled) { background:#2980b9; }
    #scoreDisplay { margin-top:15px; font-size:1.3rem; color:#34495e; font-weight:600; }
    .buzz-section { margin-bottom:60px; }
    #buzzBtn { margin-top:15px; background:#e74c3c; font-weight:700; font-size:1.7rem; padding:0; width:140px; height:140px; border-radius:50%; border:none; cursor:pointer; display:none; line-height:140px; text-align:center; color:white; }
    #buzzBtn:disabled { background:#aaa; cursor:not-allowed; }
    #buzzStatus, #buzzCountdown, #notice { margin-top:15px; font-weight:700; user-select:none; min-height:1.2em; }
    #buzzStatus { color:#c0392b; font-size:1.2rem; }
    #buzzCountdown { color:#d35400; font-size:1.2rem; }
    #drawCardBtn { background:#9b59b6; font-weight:700; font-size:1.3rem; padding:12px; border-radius:8px; border:none; cursor:pointer; display:none; color:white; }
    #drawTenBtn { background:#f1c40f; font-weight:700; font-size:1.3rem; padding:12px; border-radius:8px; border:none; cursor:pointer; display:none; color:black; }
    #logoutBtn { background:#e67e22; font-weight:700; font-size:1rem; padding:10px; border-radius:6px; border:none; cursor:pointer; user-select:none; display:none; width:80%; margin-top:10px; color:white; }
    #drawHistoryBox { max-height:200px; overflow-y:auto; margin-top:15px; padding:10px; background:#fafafa; border:1px solid #ddd; border-radius:8px; font-size:1rem; color:#555; text-align:left; }
    #drawHistoryBox h4 { margin:0 0 10px 0; font-weight:700; color:#9b59b6; }
    #drawHistoryBox ul { list-style:none; padding-left:0; margin:0; max-height:180px; overflow-y:auto; }
    #drawHistoryBox li { margin-bottom:6px; border-bottom:1px solid #eee; padding-bottom:4px; }
    #handwritingCanvas { border:1px solid #ccc; width:100%; height:200px; touch-action:none; border-radius:6px; margin-top:10px; }

    @media screen and (max-width:600px) {
      .box { max-width:95%; padding:15px; }
      input, button, textarea, #buzzBtn { width:95%; font-size:1.2rem; padding:14px; }
      #buzzBtn { font-size:1.4rem; width:110px; height:110px; line-height:110px; }
      #drawCardBtn, #drawTenBtn, #logoutBtn { width:95%; font-size:1.5rem; }
    }
  </style>
</head>

<body>

<div class="box" id="setupBox" style="display:none;">
  <h2>請輸入座號與暱稱</h2>
  <input id="seatInput" type="number" placeholder="座號" />
  <input id="nameInput" type="text" placeholder="暱稱" />
  <button onclick="enterSystem()">進入答題</button>
  <div id="notice"></div>
</div>

<div class="box" id="messageBox" style="display:none;">
  專心上課，不要打瞌睡 ~~~
  <div id="scoreDisplay">目前分數：0 分</div>
  <div class="buzz-section">
    <button id="buzzBtn" onclick="tryBuzz()">搶答</button>
    <div id="buzzStatus"></div>
    <div id="buzzCountdown"></div>
  </div>

  <div class="card-logout-section">
    <button id="drawCardBtn" onclick="drawCard()">抽卡（扣 10 分）</button>
    <button id="drawTenBtn" onclick="drawTen()">十連抽（扣 100 分）</button>
    <button id="logoutBtn" onclick="logout()">登出</button>
  </div>

  <div id="drawHistoryBox" style="display:none;">
    <h4>你的抽卡紀錄</h4>
    <ul id="drawHistoryList"></ul>
  </div>

  <div id="notice"></div>
</div>

<div class="box" id="quizBox" style="display:none;">
  <h3 id="questionText">等待老師出題中...</h3>
  <textarea id="answerInput" placeholder="請輸入文字答案" rows="3"></textarea>
  <canvas id="handwritingCanvas"></canvas>
  <button onclick="clearCanvas()">清除手寫</button>
  <button onclick="submitAnswer()">送出答案</button>
  <p id="scoreText"></p>
  <div id="notice"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC5aW_wP20TbBPMqUeGQaPw9MH0dpRjgaQ",
  authDomain: "respect-833f3.firebaseapp.com",
  databaseURL: "https://respect-833f3-default-rtdb.firebaseio.com",
  projectId: "respect-833f3",
  storageBucket: "respect-833f3.appspot.com",
  messagingSenderId: "360277137589",
  appId: "1:360277137589:web:6a7b8bf0763ef5d43446fc"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();

let seat = "";
let name = "";

let buzzCountdownTimer = null;
let buzzCountdownValue = 0;

function showNotice(msg, color="#16a085") {
  document.querySelectorAll("#notice").forEach(n => { n.innerText = msg; n.style.color = color; });
  setTimeout(() => { document.querySelectorAll("#notice").forEach(n => n.innerText = ""); }, 4000);
}

async function enterSystem() {
  seat = String(document.getElementById("seatInput").value.trim());
  name = document.getElementById("nameInput").value.trim();
  if (!seat || !name) { showNotice("⚠️ 請輸入座號與暱稱", "#e67e22"); return; }
  localStorage.setItem("seat", seat);
  localStorage.setItem("name", name);
  await setupUser();
}

async function setupUser() {
  const studentRef = db.ref("students/" + seat);
  const snapshot = await studentRef.once("value");
  if (snapshot.val()) { await studentRef.update({ nickname: name }); } 
  else { await studentRef.set({ nickname: name, score: 0 }); }
  showMainUI();
  loadDrawHistory();
  initCanvas();
}

function showMainUI() {
  document.getElementById("setupBox").style.display = "none";
  document.getElementById("messageBox").style.display = "block";
  document.getElementById("quizBox").style.display = "none";
  document.getElementById("logoutBtn").style.display = "inline-block";

  db.ref("questions/current").on("value", snapshot => {
    const data = snapshot.val();
    if (data && data.text && data.text.trim() !== "") {
      document.getElementById("questionText").innerText = data.text;
      document.getElementById("quizBox").style.display = "block";
      document.getElementById("messageBox").style.display = "none";
    } else {
      document.getElementById("quizBox").style.display = "none";
      document.getElementById("messageBox").style.display = "block";
      hideBuzzButton(); clearBuzzStatus(); clearBuzzCountdown();
    }
  });

  db.ref("students/" + seat + "/score").on("value", s => {
    const score = s.val() || 0;
    document.getElementById("scoreText").innerText = "目前分數：" + score + " 分";
    document.getElementById("scoreDisplay").innerText = "目前分數：" + score + " 分";
    document.getElementById("drawCardBtn").style.display = score >= 10 ? "inline-block" : "none";
    document.getElementById("drawTenBtn").style.display = score >= 100 ? "inline-block" : "none";
  });

  db.ref("buzzing").on("value", snap => {
    const buzzSeat = snap.val();
    if (buzzSeat === "countdown") { hideBuzzButton(); document.getElementById("buzzStatus").innerText = "搶答倒數中，請稍後..."; startBuzzCountdown(5); }
    else { clearBuzzCountdown();
      if (!buzzSeat) showBuzzButton(true), document.getElementById("buzzStatus").innerText = "現在可以搶答！";
      else if (buzzSeat === seat) showBuzzButton(false), document.getElementById("buzzStatus").innerText = "你已成功搶答！請準備回答。";
      else showBuzzButton(false), document.getElementById("buzzStatus").innerText = `座號 ${buzzSeat} 已搶答，請等待老師重置搶答。`;
    }
  });
}

function startBuzzCountdown(seconds) {
  clearBuzzCountdown();
  buzzCountdownValue = seconds;
  updateBuzzCountdownText();
  buzzCountdownTimer = setInterval(() => {
    buzzCountdownValue--;
    if (buzzCountdownValue <= 0) { clearBuzzCountdown(); document.getElementById("buzzCountdown").innerText = ""; }
    else updateBuzzCountdownText();
  }, 1000);
}
function updateBuzzCountdownText() { document.getElementById("buzzCountdown").innerText = `倒數時間：${buzzCountdownValue} 秒`; }
function clearBuzzCountdown() { if (buzzCountdownTimer) { clearInterval(buzzCountdownTimer); buzzCountdownTimer = null; } document.getElementById("buzzCountdown").innerText = ""; }
function showBuzzButton(enabled) { const btn = document.getElementById("buzzBtn"); btn.style.display = "inline-block"; btn.disabled = !enabled; }
function hideBuzzButton() { const btn = document.getElementById("buzzBtn"); btn.style.display = "none"; btn.disabled = true; }
function clearBuzzStatus() { document.getElementById("buzzStatus").innerText = ""; }
function tryBuzz() { db.ref("buzzing").transaction(currentValue => { if (!currentValue) return seat; return; }, (error, committed) => {
  if (error) showNotice("搶答失敗，請稍後再試", "#e74c3c");
  else if (!committed) showNotice("已有人搶答，請等待老師重置", "#e67e22");
  else showNotice("🎉 恭喜你，搶答成功！");
}); }

/* 手寫 Canvas */
let canvas, ctx, drawing=false;
function initCanvas() {
  canvas = document.getElementById("handwritingCanvas");
  ctx = canvas.getContext("2d");
  resizeCanvas();

  canvas.addEventListener("mousedown", startDraw);
  canvas.addEventListener("mousemove", draw);
  canvas.addEventListener("mouseup", endDraw);
  canvas.addEventListener("mouseout", endDraw);

  canvas.addEventListener("touchstart", startDraw, { passive:false });
  canvas.addEventListener("touchmove", draw, { passive:false });
  canvas.addEventListener("touchend", endDraw, { passive:false });
}
function resizeCanvas() { canvas.width=canvas.offsetWidth; canvas.height=canvas.offsetHeight; ctx.lineWidth=3; ctx.lineCap="round"; ctx.strokeStyle="#000"; }
function startDraw(e) { drawing=true; ctx.beginPath(); const pos=getPos(e); ctx.moveTo(pos.x,pos.y); e.preventDefault(); }
function draw(e) { if(!drawing) return; const pos=getPos(e); ctx.lineTo(pos.x,pos.y); ctx.stroke(); e.preventDefault(); }
function endDraw(e) { drawing=false; e.preventDefault(); }
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  let x, y;
  if(e.touches && e.touches.length>0){ x = e.touches[0].clientX - rect.left; y = e.touches[0].clientY - rect.top; }
  else { x = e.clientX - rect.left; y = e.clientY - rect.top; }
  x *= canvas.width / rect.width;
  y *= canvas.height / rect.height;
  return {x,y};
}
function clearCanvas(){ ctx.clearRect(0,0,canvas.width,canvas.height); }
function canvasIsEmpty(){ const blank=document.createElement("canvas"); blank.width=canvas.width; blank.height=canvas.height; return canvas.toDataURL()===blank.toDataURL(); }

/* 提交答案 */
async function submitAnswer() {
  const textAnswer=document.getElementById("answerInput").value.trim();
  let handwritingUrl="";
  if(!canvasIsEmpty()){
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/png"));
    const storageRef=storage.ref(`handwriting/${seat}_${Date.now()}.png`);
    await storageRef.put(blob);
    handwritingUrl=await storageRef.getDownloadURL();
  }
  if(!textAnswer && !handwritingUrl){ showNotice("請輸入文字或手寫答案","#e67e22"); return; }
  await db.ref("students/"+seat+"/answer").set({text:textAnswer,handwriting:handwritingUrl});
  showNotice("✅ 已送出！");
  document.getElementById("answerInput").value="";
  clearCanvas();
  document.getElementById("quizBox").style.display="none";
  document.getElementById("messageBox").style.display="block";
}

/* 抽卡、十連抽、登出、歷史紀錄功能 */
async function drawCard(){ /* 同前 */ }
async function drawTen(){ /* 同前 */ }
function logout(){ localStorage.removeItem("seat"); localStorage.removeItem("name"); location.reload(); }
async function loadDrawHistory(){ /* 同前 */ }

/* 初始化 */
window.onload = ()=>{
  const savedSeat = localStorage.getItem("seat");
  const savedName = localStorage.getItem("name");
  if(savedSeat && savedName){ seat=savedSeat; name=savedName; setupUser(); }
  else { document.getElementById("setupBox").style.display="block"; }
};
</script>

</body>
</html>
